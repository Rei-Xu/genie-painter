.cat:hover{background:#DFF3F5}
.cat.got{background:#DDF3E0;border-color:#3E9A57;box-shadow:0 4px 0 #3E9A57;color:#1F5A2E;opacity:.9}
.cat[disabled]{pointer-events:none}
/* 結果框 */
.pbox{margin-top:8px;flex:1!important;min-height:0;background:#FFFBEF;border:0;border-radius:18px;padding:6px 14px;text-align:center;box-shadow:inset 0 0 0 4px var(--brass),inset 0 0 0 7px #FFE3A0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.pbox.late{animation:boxin .4s both}
@keyframes boxin{0%{opacity:0;visibility:hidden;transform:scale(.8)}1%{visibility:visible}100%{opacity:1;visibility:visible;transform:scale(1)}}
.pbox h2{margin:0;font-size:42px;font-weight:normal;color:#2E8048}
.pbox.f{box-shadow:inset 0 0 0 4px var(--carpet),inset 0 0 0 7px #F7C9D1}
.pbox.f h2{color:var(--carpet)}
.pbox p{margin:3px 0;font-size:21px;line-height:1.25}
.pbox .btns{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.stars svg{width:54px;height:54px}
.bdg{display:inline-block;margin:2px;padding:2px 10px;border:2px solid var(--brass);border-radius:14px;background:#FFF1C4;font-size:20px}
.cover{background:#2A1238;color:#F6CD63;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;line-height:1.4;aspect-ratio:320/200}
.bar{height:12px;background:#E7DBF3;border-radius:6px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--carpet)}
/* 證書 */
#scr-cert{background:transparent}
#scr-cert .mid h1{color:#F6CD63!important;font-family:"GP Hand","GP Round",sans-serif;font-weight:normal;text-shadow:0 3px 0 #12081A}
#scr-cert .mid p{color:#FFF3D0}
.certp{position:absolute;left:120px;top:70px;width:1040px;height:580px;border:14px double var(--tc,#E3A73A);background:var(--tb,#FFFDF2);text-align:center;padding-top:16px;box-shadow:0 0 0 6px #2A1238,0 18px 40px rgba(0,0,0,.5)}
.certp h1{margin:0;font-size:56px;font-weight:normal;color:var(--tc,#7a5a1e);letter-spacing:6px;line-height:1.2}
.certp .nick{font-size:64px;margin:6px 0 4px;color:var(--carpet);border-bottom:4px solid var(--tc,var(--brass));display:inline-block;padding:0 40px;line-height:1.25}
.certp p{font-size:26px;margin:6px 0}
.cbadge{width:140px;height:140px;margin:4px auto 0;border-radius:50%;background:var(--tc);color:#fff;font-size:48px;line-height:140px;box-shadow:0 0 0 8px var(--tb),0 0 0 12px var(--tc);letter-spacing:2px}
.ctitle{font-size:36px;color:var(--tc);margin:10px 0 0;font-weight:normal}
.mid{position:absolute;left:0;right:0;text-align:center}
.tiers{display:flex;gap:14px;justify-content:center;margin:14px 0 20px}
.tier{border:4px solid;border-radius:14px;padding:10px 18px;font-size:26px;line-height:1.3;min-width:200px}
.tier b{display:block;font-size:34px}
#sf{position:absolute;left:30px;top:20px;right:30px;bottom:20px;overflow:auto;background:#fff;border:3px solid #888;padding:10px;font:16px/1.5 monospace;display:none;z-index:99;-webkit-user-select:text;user-select:text}
/* 圖鑑 */
.gal{position:absolute;left:14px;right:14px;top:70px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.gc{border:0;border-radius:12px;background:var(--smoke);padding:6px;min-width:0;box-shadow:0 0 0 3px var(--brass),0 5px 0 3px #12081A}
.gc.lk{background:rgba(255,255,255,.06);box-shadow:0 0 0 2px rgba(205,182,227,.3)}
.gc.lk .gn{color:rgba(231,219,243,.6)}
.gp{border-radius:6px;overflow:hidden}
.gp svg{display:block;width:100%;height:auto}
.qq{aspect-ratio:320/200;display:flex;align-items:center;justify-content:center;font-size:60px;color:rgba(205,182,227,.5);font-family:"GP Hand",sans-serif}
.qq{flex-direction:column;gap:6px}
.qq i{font-style:normal;line-height:1}
.buy{border:3px solid var(--brassd);border-radius:12px;background:linear-gradient(#F8D46A,#E3A73A);color:#3A2206;font-size:19px;padding:3px 12px;box-shadow:0 3px 0 var(--brassd)}
.buy:hover{filter:brightness(1.08)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brassd)}
.poor{font-size:17px;color:rgba(231,219,243,.7);font-family:"GP Round",sans-serif}
.gc.fresh{animation:popin .7s}
.gn .bt{font-size:15px;color:#9A6A12}
.hd .wal{font-size:21px;color:#F6CD63;margin-left:10px}
.hd .wal small{font-size:17px;color:#E7DBF3}
.gn{font-size:20px;text-align:center;line-height:1.3;height:30px;overflow:hidden;white-space:nowrap;margin-top:2px}
.fly{position:absolute;bottom:50px;width:34px;height:34px;animation:fly 1.7s ease-out both;pointer-events:none}
@keyframes fly{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-250px) rotate(540deg)}}
#photo{cursor:default}
#photo[data-act]{cursor:pointer}
#photo.blur{transform:scale(.5);transform-origin:top left;filter:blur(3px);transition:transform .4s,filter .4s}
.bigf.tilt{transform:rotate(-2.2deg)}
.cat.tried,.swd.tried{opacity:.4;pointer-events:none;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.smk .s1,.smk .s2{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="stage">
  <div id="scr-door" class="scr"></div>
  <div id="scr-map" class="scr"></div>
  <div id="scr-play" class="scr"></div>
  <div id="scr-cert" class="scr"></div>
  <div id="scr-gal" class="scr"></div>
  <div id="ov"></div>
  <div id="sf"></div>
</div>

function solve(v,lv){
  var tg=v.s,care=careOf(v,lv),T=tg.actors.length,out=[],pm=lv.posMode||'order';
  tg.actors.forEach(function(a,i){

    if(care[p+'color'])out.push(cardFor('color',a.color).id);

/* 一關的卡片庫（所有目標圖的標準解法聯集＋額外卡＋引誘卡） */

function buildPool(lv){
  if(lv._pool)return lv._pool;
  var cnt={};
  function bump(list){var t={};list.forEach(function(id){t[id]=(t[id]||0)+1;});for(var id in t)cnt[id]=Math.max(cnt[id]||0,t[id]);}

        if(a.size!=='mid')l.push(cardFor('size',a.size).id);if(a.action!=='stand')l.push(cardFor('action',a.action).id);});
      bump(l);}
  });
  var ex={};(lv.extra||[]).forEach(function(id){ex[id]=(ex[id]||0)+1;});for(var id in ex)cnt[id]=Math.max(cnt[id]||0,ex[id]);

  if(!lv.tutor&&lv.type!=='letter0'){

      if(tot>=24)return;var care=careOf(v,lv),tg=v.s,a=tg.actors[0],added=0,cs=[];
      if(care['a0.count']){var n2=a.count<5?a.count+1:a.count-1;cs.push(cardFor('count',n2,a.kind));}
      if(care['a0.color'])cs.push(cardFor('color',NEAR.color[a.color]));
      if(care.place)cs.push(cardFor('place',NEAR.place[tg.place]));
      if(care['a0.kind'])cs.push(cardFor('kind',NEAR.kind[a.kind]));
      if(care.time)cs.push(cardFor('time',NEAR.time[tg.time]));
      if(care['a0.size']&&a.size!=='mid')cs.push(cardFor('size',NEAR.size[a.size]));
      cs.forEach(function(c){if(!c||added>=2||tot>=24)return;if(cnt[c.id])return;cnt[c.id]=1;tot++;added++;});

/* 解析：卡片順序 → 主角們。顏色／數量／大小／位置接在「下一個名詞」前面，帽子圍巾接在前一個主角（沒有就接後面），動作接前一個主角 */
function parse(cards){
  var P={actors:[],place:null,time:null,dangling:[],pendAct:null},pend={},wait=[];
  function spec(c){return c.ty==='good'?{m:'set',v:c.v,c:c}:{m:'guess',pool:c.pool,c:c};}
  cards.forEach(function(c){
    if(!c||c.ty==='noise')return;
    var ap=c.ap;
    if(ap==='kind'){
      var a={kind:spec(c)};
      ['count','color','size','pos'].forEach(function(k){if(pend[k]){a[k]=pend[k];a[k].to=c.t;}});pend={};
      if(P.pendAct){a.action=P.pendAct;P.pendAct=null;}
      wait.forEach(function(w){a[w.ap]=w.s;});wait=[];
      P.actors.push(a);
    }else if(ap==='count'||ap==='color'||ap==='size'||ap==='pos'){pend[ap]=spec(c);}
    else if(ap==='hat'||ap==='scarf'){
      var col=pend.color;pend.color=null;var s;
      if(col&&col.m==='set')s={m:'set',v:col.v,c:c,cc:col.c,to:c.t,cardsColor:col.c};
      else if(col)s={m:'guess',pool:col.pool,c:col.c};
      else s={m:'guess',pool:null,c:c,bare:true};
      var last=P.actors[P.actors.length-1];if(last)last[ap]=s;else wait.push({ap:ap,s:s});
    }else if(ap==='action'){var l2=P.actors[P.actors.length-1];if(l2)l2.action=spec(c);else P.pendAct=spec(c);}
    else if(ap==='place'||ap==='time'){P[ap]=spec(c);}
  });

}

      else if(pl[0]==='R'||pl[1]==='L'){for(p=0;p<3;p++)maps[p]=[1,0];}
      else{pg=true;maps=[[0,1],[1,0],RND(rng,2)?[0,1]:[1,0]];}
    }
  }else{for(p=0;p<3;p++)maps[p]=seq();}
  return{maps:maps,pg:pg};
}
function REGORDER(r){return r==='sky'?0:r==='ground'?9:1+parseInt(r.slice(1),10);}
function why(asp,x,ctx){
  var s=x.src,d=nm(asp,x.v,ctx.kind),pre=ctx.who?ctx.who+'：':'',tn=nm(asp,ctx.tv,ctx.tk||ctx.kind);
  switch(s.k){
    case'set':if(s.to&&(asp==='color'||asp==='hat'||asp==='scarf'))return pre+'你把「'+(s.cc||s.c).t+'」放在「'+s.to+'」前面，所以我畫成'+d+'。客人要的是'+tn+'。';
      return pre+'客人要'+tn+'，你寫的是'+(s.c.t)+'。';
    case'guess':return pre+(s.c.msg?s.c.msg.replace('{v}',d):'「'+s.c.t+'」是哪一種？我不確定，就猜了'+d+'。');
    case'none':return pre+'你沒說'+FIELD[asp]+'，我隨便畫了'+d+'。';

/* 核心：一組卡片 → 三張畫＋比對結果 */
function runPrompt(cards,lv,v,rng){
  rng=rng||Math.random;
  var tg=v.s,T=tg.actors.length,care=careOf(v,lv),P=parse(cards);
  var acts=P.actors.slice(0,T);if(!acts.length)acts=[{}];
  var sm=slotMaps(acts,T,lv.posMode||'order',rng);
  function R(key,asp,sp,tv){
    var i;
    if(!care[key])return[0,1,2].map(function(){return{v:tv,src:{k:'free'}};});
    if(sp&&sp.m==='set')return[0,1,2].map(function(){return{v:sp.v,src:{k:'set',c:sp.c,cc:sp.cc,to:sp.to}};});
    if(sp&&sp.m==='guess')return g3(sp.pool||poolOf(asp,lv,v),tv,rng).map(function(x){return{v:x,src:{k:'guess',c:sp.c}};});
    var dg=null;for(i=0;i<P.dangling.length;i++)if(P.dangling[i].ap===asp)dg=P.dangling[i];
    if(asp in PLAIN)return[0,1,2].map(function(){return{v:PLAIN[asp],src:{k:'plain'}};});
    if(key==='place'&&lv.fav&&lv.fav.place)return[0,1,2].map(function(){return{v:lv.fav.place,src:{k:'fav'}};});
    return g3(poolOf(asp,lv,v),tv,rng).map(function(x){return{v:x,src:dg?{k:'dang',c:dg.c}:{k:'none'}};});
  }
  var G={place:R('place','place',P.place,tg.place),time:R('time','time',P.time,tg.time)};
  var AR=acts.map(function(a,ai){var o={};ASP.forEach(function(x){var tv=ai<T?tg.actors[ai][x]:null;o[x]=R('a'+ai+'.'+x,x,a[x],tv);});return o;});
  var pics=[],red={},pass=true;
  for(var p=0;p<3;p++){
    var sc={place:G.place[p],time:G.time[p],slots:[]},diffs=[];
    function add(region,key,text,gp,gv){diffs.push({region:region,key:key,text:text,gp:gp,gv:gv});}
    if(!(care.place?G.place[p].v===tg.place:true))add('ground','place',why('place',G.place[p],{tv:tg.place}),groupText('place',G.place[p],{}),nm('place',G.place[p].v));
    if(!(care.time?G.time[p].v===tg.time:true))add('sky','time',why('time',G.time[p],{tv:tg.time}),groupText('time',G.time[p],{}),nm('time',G.time[p].v));
    for(var s=0;s<T;s++){
      var ai=sm.maps[p][s],ta=tg.actors[s],pre='a'+s+'.',who=T===2?(s===0?'左邊':'右邊'):'',hasCare=false,sd=[];
      ASP.forEach(function(x){if(care[pre+x])hasCare=true;});
      if(ai<0){sc.slots.push(null);if(hasCare)sd.push({region:'a'+s,key:pre+'who',text:(who?who+'：':'')+'你沒說這裡要畫誰，所以我沒畫。'});}
      else{
        var ac={};ASP.forEach(function(x){ac[x]=AR[ai][x][p];});sc.slots.push(ac);
        ASP.forEach(function(x){
          if(!care[pre+x])return;
          if(ac[x].v!==ta[x])sd.push({region:'a'+s,key:pre+x,text:why(x,ac[x],{who:who,kind:ac.kind.v,tv:ta[x],tk:ta.kind}),gp:groupText(x,ac[x],{who:who}),gv:nm(x,ac[x].v,ac.kind.v)});
        });
        if(sm.pg&&sd.length)sd=[{region:'a'+s,key:pre+'pos',text:'左邊右邊你沒說清楚，我隨便排。'}];
      }
      diffs=diffs.concat(sd);
    }
    diffs.sort(function(a,b){return REGORDER(a.region)-REGORDER(b.region);});
    var regs=[];diffs.forEach(function(d){if(regs.indexOf(d.region)<0)regs.push(d.region);red[d.region]=1;});
    if(diffs.length)pass=false;
    pics.push({sc:sc,diffs:diffs,regs:regs});
  }
  return{pics:pics,pass:pass,red:red,care:care,sm:sm};
}

function pickPR(prk,last,rng,tcount){

  for(i=0;i<L.length;i++){if(L[i].n_!=null&&L[i].n_===tcount)continue;if(last&&last[prk]===i&&L.length>1)continue;ok.push(i);}

/* 許願：卡片 → 神燈怎麼整你。pass＝完全沒漏洞。flaws＝要演出的漏洞（最多 3 個，除非 all），all＝全部漏洞 */
function wish(cards,lv,v,rng,last,all){
  rng=rng||Math.random;last=last||{};
  var r=runPrompt(cards,lv,v,rng),P=parse(cards),tg=v.s,keys=[],fl=[];
  r.pics.forEach(function(p){p.diffs.forEach(function(d){var k=d.key.replace(/\.who$/,'.kind').replace(/^a\d\.pos$/,'pos');if(keys.indexOf(k)<0)keys.push(k);});});
  keys.forEach(function(k){
    var f={key:k,asp:null,type:'miss',ai:null},sp,x,N;
    if(k==='pos'){f.asp='pos';f.type='pos';fl.push(f);return;}
    if(k==='place'||k==='time'){f.asp=k;sp=P[k];}
    else{N=parseInt(k.charAt(1),10);x=k.split('.')[1];f.asp=x;f.ai=N;
      var wi=r.sm.maps[0][N];
      if(wi==null||wi<0){f.type='who';fl.push(f);return;}
      sp=P.actors[wi]?P.actors[wi][x]:undefined;
      if(x==='hat'||x==='scarf'){for(var s=0;s<tg.actors.length;s++){var wj=r.sm.maps[0][s];if(s!==N&&wj>=0&&P.actors[wj]&&P.actors[wj][x]){f.otherSlot=s;}}}
    }
    if(sp){
      if(sp.m==='set'){f.type='wrong';f.wrote=sp.v;f.card=sp.c;f.cc=sp.cc;}
      else{f.card=sp.c;f.type=sp.c.ty==='vague'?'vague':sp.c.ty==='super'?'super':'miss';}
    }else{
      for(var q=0;q<P.dangling.length;q++)if(P.dangling[q].ap===f.asp){f.type='dang';f.card=P.dangling[q].c;}
    }
    fl.push(f);
  });
  fl.sort(function(a,b){return FPRI[a.asp]-FPRI[b.asp];});
  var noise=cards.some(function(c){return c&&c.ty==='noise';});
  var use=all?fl:fl.slice(0,3);
  use.forEach(function(f){
    var ta=f.ai!=null?tg.actors[f.ai]:null,kindN=ta?NAME.kind[ta.kind]:'';
    f.mood=MOOD[f.asp]||'laugh';
    if(f.type==='wrong'){
      var wn=nm(f.asp,f.wrote,ta?ta.kind:null);f.id='wrong';f.pr=null;f.n='照字面畫';
      var tv=f.asp==='place'||f.asp==='time'?tg[f.asp]:ta[f.asp];
      var tn=nm(f.asp,tv,ta?ta.kind:null);f.cust='我要'+tn+'！你給我'+wn+'是怎樣！';f.mood='angry';f.tongue=true;
      if(f.asp==='color'&&ta&&f.wrote!==tv&&(f.wrote===ta.hat||f.wrote===ta.scarf))f.ln='你說'+nm('color',f.wrote)+'的是'+kindN+'，不是'+(f.wrote===ta.hat?'帽子':'圍巾')+'喔～';
      else f.ln=pickWrong(wn,rng);
    }else if(f.type==='who'){
      var pk=PR['kind.miss'],ix=pickPR('kind.miss',last,rng,null),pw=pk[ix];f.pr='kind.miss';f.id=pw.id;f.n=pw.n;f.ln='這裡你沒說要畫誰～'+pw.ln;
    }else{
      var prk=prKey(f,ta),L=PR[prk];f.pr=prk;
      var hasOther=(f.asp==='hat'||f.asp==='scarf')&&f.otherSlot!=null;
      if(hasOther){f.id='other';f.n='戴到別人頭上';f.forced=true;var on=NAME.kind[tg.actors[f.otherSlot].kind];f.ln=(f.asp==='hat'?'帽子':'圍巾')+'？我給'+on+'戴～你沒說清楚是誰戴喔！';}
      else{var idx=pickPR(prk,last,rng,ta?ta.count:null),pv=L[idx];f.id=pv.id;f.n=pv.n;f.vn=pv.n_;f.ln=fillLn(pv.ln,f.card?f.card.t:'',pv.n_);
        if(rng()<.4){var gl=(f.type==='vague'||f.type==='super')?GEN.vague:GEN[f.asp];if(gl)f.ln=fillLn(gl[RND(rng,gl.length)],f.card?f.card.t:'',null);}}
      if(f.type==='dang')f.ln='「'+f.card.t+'」什麼？'+f.card.t.replace(/的$/,'')+'空氣嗎？';
    }
  });
  return{pass:r.pass,flaws:use,all:fl,noise:noise,run:r};
}

  var out=[];Object.keys(CERT_MIX).forEach(function(k){var pool=shuffle(by[k]||[],rng);for(var i=0;i<CERT_MIX[k];i++)if(pool.length)out.push(pool[i%pool.length]);});
  return shuffle(out,rng);
}
function rubbable(l){return l.type!=='bad'&&l.type!=='swap';}
function chIsLate(l){return typeof l.ch==='number'&&l.ch>=3&&l.type!=='letter'&&l.type!=='swap';}
function greedy(lv,v,pool){
  var tg=v.s,tk=[['time',tg.time]];
  tg.actors.forEach(function(a){
    tk.push(['count',a.count,a.kind]);if(a.size!=='mid')tk.push(['size',a.size]);tk.push(['color',a.color]);tk.push(['kind',a.kind]);
    if(a.action!=='stand')tk.push(['action',a.action]);
    if(a.hat!=='none'){tk.push(['color',a.hat]);tk.push(['hat',true]);}
    if(a.scarf!=='none'){tk.push(['color',a.scarf]);tk.push(['scarf',true]);}
  });
  tk.push(['place',tg.place]);
  var left=pool.slice(),out=[];
  tk.forEach(function(t){var c=cardFor(t[0],t[1],t[2]);if(!c)return;var i=left.indexOf(c.id);if(i<0)return;left.splice(i,1);out.push(c);});
  return out.slice(0,lv.slots);
}
function concreteFirst(lv,pool){return pool.filter(function(id){return CARD[id].ty==='good';}).slice(0,lv.slots).map(function(id){return CARD[id];});}
function trapFor(sol,pool){
  for(var i=0;i<sol.length;i++){
    var c=CARD[sol[i]];if(c.ap==='pos'||c.ap==='hat'||c.ap==='scarf')continue;
    for(var j=0;j<pool.length;j++){var t=CARD[pool[j]];
      if(t.id===c.id||t.ap!==c.ap)continue;
      if(t.ty==='good'&&t.v===c.v)continue;
      var r=sol.slice();r[i]=t.id;return{idx:i,ids:r};}
  }
  return null;
}

}
function drawMos(){
  var cv=$('mos');if(!cv)return;var x=cv.getContext('2d'),W=640,H=400;
  if(!S.mosData&&!S.mosFb){x.fillStyle='#cfc4a4';x.fillRect(0,0,W,H);return;}
  var lvl=Math.min(S.mosC,GP.MOSAIC.cols.length-1),cols=GP.MOSAIC.cols[lvl],rows=Math.round(cols*H/W),bw=W/cols,bh=H/rows,r,c,yy,xx;
  if(S.mosFb){var t=document.createElement('canvas');t.width=cols;t.height=rows;t.getContext('2d').drawImage(S.mosFb,0,0,cols,rows);x.imageSmoothingEnabled=false;x.drawImage(t,0,0,cols,rows,0,0,W,H);return;}
  var d=S.mosData.data;
  for(r=0;r<rows;r++)for(c=0;c<cols;c++){
    var x0=Math.floor(c*bw),x1=Math.floor((c+1)*bw),y0=Math.floor(r*bh),y1=Math.floor((r+1)*bh),R=0,G=0,B=0,n=0;
    for(yy=y0;yy<y1;yy++)for(xx=x0;xx<x1;xx++){var k=(yy*W+xx)*4;R+=d[k];G+=d[k+1];B+=d[k+2];n++;}
    x.fillStyle='rgb('+Math.round(R/n)+','+Math.round(G/n)+','+Math.round(B/n)+')';x.fillRect(x0,y0,x1-x0,y1-y0);}
}
function resultBox(){
  var lv=S.lv,ty=lv.type,h='',late=S.fresh?(S.prank&&S.prank.flaws?(S.prank.flaws.length*1.15+1.6):1.8):0,st=late?' style="animation-delay:'+late+'s"':'';
  var cls=late?' late':'';
  if(S.phase==='leave')return'<div class="pbox f'+cls+'" style="animation-delay:0s"><h2>客人走了</h2><p>等太久，客人搖頭離開了。這位重新來，金幣少 1 枚。</p><div class="btns"><button class="btn gold" data-act="retry">重來這一位</button><button class="btn gray" data-act="map">回地圖</button></div></div>';
  if(S.phase==='certnext'){
    var last=S.cert.i+1>=GP.CERT_N,qa=(ty==='bad'||ty==='swap'),ok=S.earn.ok;
    return'<div class="pbox'+(ok?'':' f')+cls+'"'+st+'><h2>'+(ok?(qa?'答對了！':'客人開心！'):(qa?'這題沒答對':'客人氣跑了'))+'</h2><p>目前答對 '+S.cert.ok+' / '+(S.cert.i+1)+' 題</p><div class="btns"><button class="btn gold big" data-act="certnext">'+(last?'看結果':'下一題 ›')+'</button></div></div>';
  }
  if(S.phase==='fail')return'<div class="pbox f'+cls+'"'+st+'><h2>客人氣跑了！</h2><p>三次都被整，客人氣沖沖走掉了。換一位新客人再來。</p><div class="btns"><button class="btn" data-act="restart">換一位再來</button><button class="btn gray" data-act="map">回地圖</button></div></div>';
  var e=S.earn;h='<div class="pbox'+cls+'"'+st+'><h2>客人開心！</h2><div>'+coinsHTML(e.coins)+'</div><p>付了 '+e.coins+' 枚金幣'+(ty==='swap'||ty==='bad'?'':ty==='mosaic'?'（看清楚 '+S.mosC+' 次，第 '+S.rubs+' 次許願成功）':'（第 '+S.rubs+' 次許願成功'+(e.min?'，卡片最精簡 +1':'')+'）')+'</p>';
  var b=[];if(e.pen)b.push('畫筆徽章（精簡獎）');if(e.pro)b.push('神燈徽章（找到全部漏洞）');if(e.mw)b.push('語文徽章（量詞用對了）');if(e.hl)b.push('重點星（重點全部抓對）');
  if(b.length)h+='<p>'+b.map(function(x){return'<span class="bdg">'+x+'</span>';}).join('')+'</p>';
  if(lv.mw&&!e.mw)h+='<p>量詞可以再想想：魚「條」、花「朵」、狗「隻」。</p>';
  if(ty!=='swap'&&ty!=='bad')h+='<p>用了 '+e.cards+' 張卡'+(e.min?'，剛好是最少的！':'，最少只要 '+e.minN+' 張。')+'</p>';
  h+='<div class="btns"><button class="btn gold big" data-act="next">'+(nextLevel()?'下一位客人 ›':'回地圖')+'</button><button class="btn gray" data-act="restart">再玩一次</button></div></div>';
  return h;
}
function nextLevel(){var g=S.g,lv=S.lv,m=mainLevels(g),i=m.indexOf(lv);if(i>=0)return i+1<m.length?m[i+1]:null;var c=LEVELS[g].challenge,j=c.indexOf(lv);return j>=0&&j+1<c.length?c[j+1]:null;}

/* ---------- 許願 ---------- */
function coinsFor(rubs,min,late){var c=rubs<=1?3:rubs===2?2:1;if(late)c=Math.max(1,c-1);return c+(min?1:0);}
function doRub(){
  var lv=S.lv,v=S.v;if(S.phase!=='play')return;
  var cards=curCards(),w=GP.wish(cards,lv,v,Math.random,S.last);S.prank=w;S.total++;
  sfx('magic',.5);if(w.pass)sfx('win',.6,1.1);else sfx('boing',.55,.9);
  if(!(lv.tutor&&S.total===1&&!w.pass))S.rubs++;
  S.fresh=true;S.holdUntil=Date.now()+6000;
  S.prank.mood=w.pass?'happy':(w.flaws.some(function(f){return f.mood==='angry';})?'angry':w.flaws[0].mood);
  var wr=w.flaws.filter(function(f){return f.cust;})[0];
  S.prank.q=w.pass?pickQ('happy'):(wr?wr.cust:pickQ(S.prank.mood));
  if(w.pass){var jk=pickOf(JOKES);S.prank.joke=jk.id;S.prank.lamp=jk.ln;}
  galAdd(w.flaws);
  if(w.pass){finishPass(cards);}
  else{
    S.say='';
    if(S.rubs>=S.maxRubs){S.phase=S.cert?'certnext':'fail';if(S.cert)S.earn={ok:false};sfx('fail',.5,2.6);}
  }
  renderPlay();S.fresh=false;
}
function finishPass(cards){
  var lv=S.lv,v=S.v,sol=GP.solve(v,lv),min=cards.length===sol.length;
  var e={coins:lv.type==='mosaic'?GP.mosaicCoins(S.mosC,S.rubs):coinsFor(S.rubs,min,S.late),cards:cards.length,minN:sol.length,min:min,pen:min,pro:false,mw:!!lv.mw&&GP.mwOk(cards,v),hl:lv.type==='letter'&&S.hl.ok};
  S.earn=e;
  if(S.cert){S.cert.ok++;e.ok=true;S.phase='certnext';return;}
  S.phase='pass';saveRec(e);
}
function saveRec(e){var g=S.g,lv=S.lv,r=SV[g].lv[lv.id]||{coins:0};
  r.coins=Math.max(r.coins||0,e.coins);r.pen=r.pen||e.pen;r.pro=r.pro||!!e.pro;r.mw=r.mw||e.mw;r.hl=r.hl||e.hl;SV[g].lv[lv.id]=r;writeSave();}

/* ---------- 換你當神燈 ---------- */
function swapFindFlaws(fl){
  var sw=S.sw;
  fl.forEach(function(f){sw.found.push(f.key);galAdd([f]);S.prank.flaws.push(f);});
  sfx('boing',.55);  var lf=fl[fl.length-1];S.prank.noise=false;S.fresh=true;S.prank.mood=lf.mood;S.prank.q=pickQ(lf.mood);S.note='';
  if(sw.found.length>=sw.w.all.length){
    var coins=GP.swapCoins(sw.wrong);
    S.earn={coins:coins,cards:0,minN:0,min:false,pen:false,pro:true,mw:false,hl:false};
    if(S.cert){S.earn.ok=sw.wrong<=1;if(S.earn.ok)S.cert.ok++;S.phase='certnext';}else{S.phase='pass';saveRec(S.earn);}
  }
  renderPlay();S.fresh=false;
}
function swapWrong(msg){S.sw.wrong++;sfx('err',.5);S.note=msg;renderPlay();}

/* ---------- 找出壞詞（挑戰章） ---------- */
function doBad(i){
  if(S.phase!=='play')return;
  if(i===S.v.culprit){sfx('win',.6);var st=S.badWrong===0?3:S.badWrong===1?2:1;
    S.earn={coins:st,cards:S.v.prompt.length,minN:S.v.prompt.length,min:true,pen:false,pro:false,mw:false,hl:false};
    if(S.cert){S.earn.ok=S.badWrong===0;if(S.earn.ok)S.cert.ok++;S.phase='certnext';}else{S.phase='pass';saveRec(S.earn);}
    S.say='答對了！害神燈鑽漏洞的就是「'+CARD[S.v.prompt[i]].t+'」。換成「'+CARD[S.v.fix].t+'」就不會被整了。';S.prank.flaws=[];S.prank.pass=true;S.prank.lamp=S.say;S.prank.q='太棒了！';}
  else{sfx('err',.5);S.badWrong++;S.note='「'+CARD[S.v.prompt[i]].t+'」沒有問題。看看神燈整了哪裡，再想想！';}
  renderPlay();
}

/* ---------- 證照考 ---------- */
function tierRange(i){var T=GP.CERT_TIERS,hi=i===0?GP.CERT_N:T[i-1].min-1,lo=T[i].min;return lo===hi?String(lo):lo+'–'+hi;}
function tierBadges(){return'<div class="tiers">'+GP.CERT_TIERS.map(function(t,i){return'<div class="tier" style="background:'+t.bg+';border-color:'+t.color+';color:'+t.color+'"><b>'+t.name+'</b>答對 '+tierRange(i)+' 題</div>';}).reverse().join('')+'</div>';}
function goCert(){
  var g=S.g;S.cert=null;show('cert');overlay();
  var L=LEVELS[g],h='<div class="hd"><button class="btn gray sm" data-act="map">‹ 地圖</button><span class="ttl">'+L.cert+'</span><span class="grow"></span></div>';
  if(SV[g].cert)h+=certHTML();
  else h+='<div class="mid" style="top:80px"><h1 style="font-size:58px;margin:0;color:#7a5a1e">證照考</h1><p style="font-size:28px;line-height:1.6;margin:10px 60px">一共 '+GP.CERT_N+' 位客人，有看圖寫願望、客人的信、閃電看圖、馬賽克、找出壞詞、換你當神燈。<br>每題只有 <b>1 次</b>機會。答對的題數，決定證書的等級：</p>'+tierBadges()+'<button class="btn gold big" data-act="certstart">開始</button></div>';
  $('scr-cert').innerHTML=h;
}
function certHTML(){
  var g=S.g,L=LEVELS[g],c=SV[g].cert,t=GP.certTier(c.ok),tt=totals(g);
  return'<div class="certp" style="--tc:'+t.color+';--tb:'+t.bg+'"><h1>'+L.cert+'</h1><p>神燈畫家 認證</p><div class="cbadge">'+t.name+'</div><div class="ctitle">'+t.title+'</div><div class="nick">'+esc(c.nick||'無名畫家')+'</div><p>證照考 '+(c.n||GP.CERT_N)+' 題，答對 '+c.ok+' 題</p><p style="font-size:22px">金幣 '+tt.coin+'　畫筆 '+tt.pen+'　神燈 '+tt.pro+'　語文 '+tt.mw+'　圖鑑 '+galCount(g)+'/'+GAL.length+'　'+esc(c.date||'')+'</p></div><div class="mid" style="top:658px"><button class="btn gray sm" data-act="map">回地圖</button>　<button class="btn gold sm" data-act="certstart">再考一次（想拿更高等級）</button></div>';
}
function certStart(){S.cert={qs:GP.certPlan(S.g,Math.random),i:0,ok:0};startCertQ();}
function startCertQ(){var l=S.cert.qs[S.cert.i];startLevel(l,{cert:S.cert});S.say=l.type==='bad'?'證照考：第一次就點對才算答對。':l.type==='swap'?'證照考：最多點錯 1 次才算答對。':'證照考：只有 1 次機會，想清楚再許願。';renderPlay();}
function certNext(){
  S.cert.i++;
  if(S.cert.i>=GP.CERT_N){stopTimer();certNick(S.cert.ok);}
  else startCertQ();
}
var NICKS=['彩虹貓','小神燈','畫畫龍','閃電兔','星星狗','魔法筆','快樂鳥','金色魚'];
function certNick(ok){
  var t=GP.certTier(ok);show('cert');overlay();
  $('scr-cert').innerHTML='<div class="hd"><span class="ttl">證照考結束！</span></div><div class="mid" style="top:90px"><h1 style="font-size:52px;margin:0;color:'+t.color+'">答對 '+ok+' / '+GP.CERT_N+' 題　等級：'+t.name+'</h1><p style="font-size:30px;line-height:1.6;margin:8px 0">幫自己取一個暱稱，印在證書上。<b style="color:var(--red)">不要用真名喔！</b></p><p><input id="nick" maxlength="8" value="'+(SV[S.g].nick||NICKS[Math.floor(Math.random()*NICKS.length)])+'" style="font-size:42px;width:380px;text-align:center;border:4px solid '+t.color+';border-radius:12px;padding:6px;font-family:inherit"></p><p><button class="btn gray" data-act="nickrand">換一個</button>　<button class="btn gold big" data-act="nickok" data-ok="'+ok+'">領證書</button></p>'+tierBadges()+'</div>';
}
function nickOk(ok){
  var el=$('nick'),n=(el&&el.value||'').replace(/^\s+|\s+$/g,'').slice(0,8)||'無名畫家',d=new Date(),old=SV[S.g].cert;
  if(!old||ok>=old.ok)SV[S.g].cert={ok:ok,n:GP.CERT_N,nick:n,date:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
  SV[S.g].nick=n;writeSave();goCert();
}

/* ---------- 事件 ---------- */
function onAct(act,t){
  var lv=S.lv,i;
  if(/^(pick|unpick|clear|key|play|map|gal|gpg|door|kclose|hl|hlcheck|mosmore|peek|pause|resume|next|restart|retry|cert|certstart|certnext|home|swcard|swcat)$/.test(act)&&act!=='swcard'&&act!=='swcat')sfx(act==='door'?'open':act==='pick'?'pick':act==='unpick'||act==='clear'?'back':'click',.5);
  switch(act){
    case'mute':toggleMute();break;
    case'door':S.doorTry=t.getAttribute('data-g');S.code='';renderKeypad('');break;
    case'kclose':S.doorTry=null;S.code='';overlay();break;
    case'key':pressKey(t.getAttribute('data-k'));break;
    case'home':S.g=null;stopTimer();overlay();show('door');renderDoor();break;
    case'map':stopTimer();goMap();break;
    case'gal':S.gpage=0;goGal();break;
    case'buy':{var gid=t.getAttribute('data-gid'),G=SV[S.g];
      if(!G.gal[gid]&&wallet(S.g)>=GAL_PRICE){G.spent=spent(S.g)+GAL_PRICE;G.gal[gid]=2;writeSave();sfx('win',.5);S.bought=gid;}else sfx('err',.5);
      goGal();break;}
    case'gpg':S.gpage=Math.max(0,S.gpage+parseInt(t.getAttribute('data-d'),10));goGal();break;
    case'play':{var l=findLv(S.g,t.getAttribute('data-id'));if(l&&unlocked(S.g,l))startLevel(l);break;}
    case'cert':if(mainDone(S.g))goCert();break;
    case'certstart':certStart();break;
    case'certnext':certNext();break;
    case'nickrand':{var el=$('nick');if(el)el.value=NICKS[Math.floor(Math.random()*NICKS.length)];break;}
    case'nickok':nickOk(parseInt(t.getAttribute('data-ok'),10));break;
    case'pick':{var u=t.getAttribute('data-u');if(S.phase!=='play')break;var s=S.slots.indexOf(null);if(s<0){S.note='格子滿了！點格子裡的卡可以拿回來。';}else S.slots[s]=u;renderPlay();break;}
    case'unpick':if(S.phase==='play'){S.slots[parseInt(t.getAttribute('data-s'),10)]=null;
      var arr=S.slots.filter(function(x){return x;});while(arr.length<S.slots.length)arr.push(null);S.slots=arr;renderPlay();}break;
    case'clear':if(S.phase==='play'){for(i=0;i<S.slots.length;i++)S.slots[i]=null;renderPlay();}break;
    case'rub':doRub();break;
    case'peek':if(S.phase==='play'&&isBlur()){S.peek=3;if(S.patMax>0){S.pat=Math.max(1,S.pat-8);updPat();}applyBlur();}break;
    case'swcard':{if(S.phase!=='play')break;var ci=parseInt(t.getAttribute('data-i'),10),c=S.sw.cards[ci],k=cardKey(S.sw.P,c),
      fl=k===null?[]:S.sw.w.all.filter(function(f){return f.key===k&&S.sw.found.indexOf(f.key)<0;});
      if(fl.length)swapFindFlaws(fl);else{S.sw.tried['w'+ci]=1;swapWrong(c.ty==='noise'?'「'+c.t+'」？我加蝴蝶結就好，這不算漏洞喔～':pickOf(NOTE_OK));}break;}
    case'swcat':{var cat=t.getAttribute('data-c');if(S.phase!=='play')break;var hit=GP.swapHit(S.sw.w.all,cat,S.sw.found);
      if(hit.length)swapFindFlaws(hit);else{S.sw.tried['c'+cat]=1;swapWrong(pickOf(NOTE_OK));}break;}
    case'mosmore':if(S.phase==='play'&&S.lv.type==='mosaic'&&S.mosC<GP.MOSAIC.cols.length-1){S.mosC++;renderPlay();}break;
    case'hl':if(!S.hl.checked){i=t.getAttribute('data-i');S.hl.sel[i]=!S.hl.sel[i];renderPlay();}break;
    case'hlcheck':{
      if(!Object.keys(S.hl.sel).some(function(k){return S.hl.sel[k];})){S.note='先點一點信裡重要的詞喔！';renderPlay();break;}
      var ok=true;letterSegs(S.v.text).forEach(function(sg,j){if(!!sg.k!==!!S.hl.sel[j])ok=false;});
      S.hl.checked=true;S.hl.ok=ok;S.say=ok?'重點全部抓對了！得到一顆重點星。再用卡片寫願望吧。':'金色的字是真正的重點（紅框是你漏掉的，劃線是不必要的）。再用卡片寫願望吧。';renderPlay();break;}
    case'bad':doBad(parseInt(t.getAttribute('data-i'),10));break;
    case'next':{var nx=nextLevel();if(nx)startLevel(nx);else goMap();break;}
    case'restart':startLevel(lv);break;
    case'retry':startLevel(lv,{vi:S.vi,late:true});break;
    case'pause':S.paused=true;overlay('<div class="modal"><h2>休息一下</h2><p>畫面先蓋起來囉。</p><p><button class="btn gold" data-act="resume">繼續</button>　<button class="btn gray" data-act="map">回地圖</button></p></div>',true);break;
    case'resume':S.paused=false;overlay();renderPlay();break;
  }
}
document.addEventListener('click',function(e){var t=e.target;while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-act')))t=t.parentNode;if(t&&t!==document)onAct(t.getAttribute('data-act'),t);});
document.addEventListener('keydown',function(e){
  if(!S.doorTry)return;
  if(/^[0-9]$/.test(e.key)){pressKey(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){pressKey('bs');e.preventDefault();}
  else if(e.key==='Enter'){pressKey('ok');e.preventDefault();}
  else if(e.key==='Escape'){S.doorTry=null;S.code='';overlay();}
});

/* ---------- 自動檢查畫面 ---------- */
function runSelftest(){
  show('door');$('scr-door').innerHTML='<h1 style="font-size:44px;top:10px">神燈畫家 自動檢查中…</h1>';
  var t0=Date.now(),r;
  try{r=GP.selftest();}catch(err){r={pass:false,items:[{id:0,name:'檢查程式出錯',pass:false,detail:String(err&&err.stack||err)}]};}
  window.__selftest=r;
  var h='<h2>神燈畫家 selftest：'+(r.pass?'全部通過':'有項目失敗')+'（'+(Date.now()-t0)+' ms）</h2>';
  r.items.forEach(function(it){h+='<div style="color:'+(it.pass?'#1a6a1a':'#b00')+'">'+(it.pass?'✔':'✘')+' '+it.id+'. '+esc(it.name)+'<br>　　'+esc(it.detail)+'</div>';});
  var sf=$('sf');sf.innerHTML=h;sf.style.display='block';
}
window.__gpUI={fn:{goGal:goGal,mainLevels:mainLevels,renderKeypad:renderKeypad,overlay:overlay,goMap:goMap},S:S,start:function(g,id,vi){S.g=g;overlay();startLevel(findLv(g,id),{vi:vi});},map:function(g){S.g=g;goMap();},cert:function(g){S.g=g;goCert();},setSave:function(o){SV=o;writeSave();}};
/* ---------- 啟動 ---------- */
if(/[?&]selftest=1/.test(location.search)){runSelftest();}
else{renderDoor();show('door');}
})();
/*UI-END*/
</script>
