/* ===== 2026-11-24 美術版：夜市畫攤。夜市紫＋黃銅神燈＋煙霧白＋磁磚青＋魔毯紅；粉圓（介面）＋芫荽（神燈與客人說話、標題） ===== */
:root{--plum:#3B1E50;--plum2:#2A1238;--night:#1C0C27;--smoke:#F5EFFB;--smoke2:#E7DBF3;--lilac:#CDB6E3;--violet:#8A5BB8;--brass:#E3A73A;--brass2:#F6CD63;--brassd:#7A4A0C;--tile:#1F8F9A;--tiled:#0F5A61;--carpet:#C93A4E;--ink:#2A1838;
  --gold:#E3A73A;--paper:#F5EFFB;--red:#C93A4E;--jade:#1F8F9A;--paper2:#E7DBF3;--paper3:#FFFDF8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#3B1E50,#2A1238) fixed #2A1238}
body{font-family:"GP Round","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
.hand,.lb .tx,.rx,.letter,.ct,.hd .ttl,.modal h2,.pbox h2,.certp h1,.certp .nick,.ctitle{font-family:"GP Hand","GP Round","Microsoft JhengHei",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #F6CD63;outline-offset:2px}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(circle at 20% 15%,rgba(246,205,99,.08) 0 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 70% 60%,rgba(205,182,227,.08) 0 2px,transparent 3px) 0 0/62px 62px,linear-gradient(#3B1E50,#2A1238)}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
/* 靜音鈕 */
.mute{width:44px;height:40px;flex:none;border:3px solid #6E4A8A;border-radius:12px;background:#2A1238;padding:4px;display:flex;align-items:center;justify-content:center}
.mute svg{width:26px;height:26px;display:block}
.dmute{position:absolute;right:18px;top:16px;z-index:6}
/* ===== 開場：神燈冒煙寫出標題 ===== */
#scr-door{background:radial-gradient(ellipse at 50% 108%,rgba(246,205,99,.35),transparent 46%),radial-gradient(ellipse at 50% 0%,#4C2766,transparent 70%),linear-gradient(#2A1238,#1C0C27)}
#scr-door .stars{position:absolute;inset:0;width:100%;height:100%}
#scr-door .smk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.smk path{fill:none;stroke-linecap:round}
.smk .s1{stroke:url(#smg);stroke-width:46;opacity:.55;filter:url(#smb);stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s .3s ease-out forwards}
.smk .s2{stroke:#F5EFFB;stroke-width:10;opacity:.35;filter:url(#smb);stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#scr-door h1{position:absolute;left:0;right:0;top:46px;margin:0;text-align:center;font-family:"GP Hand","GP Round",sans-serif;font-size:96px;font-weight:normal;letter-spacing:14px;color:#FFF3D0;text-shadow:0 0 18px rgba(246,205,99,.75),0 4px 0 #7A4A0C;animation:tin 1s 1.6s both}
#scr-door .sub{position:absolute;left:0;right:0;top:168px;text-align:center;font-size:25px;color:#E7DBF3;letter-spacing:1px;animation:tin 1s 2s both}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.blamp{position:absolute;left:474px;top:452px;width:332px;height:250px}
.blamp svg{width:100%;height:100%;display:block;overflow:visible}
.doors{position:absolute;left:0;right:0;top:0}
/* 兩尊古埃及神像（神龕門）：左貓神、右胡狼神 */
.door{position:absolute;top:228px;width:300px;height:440px;border:0;padding:0;background:none;text-align:center;filter:drop-shadow(0 10px 0 #12081A) drop-shadow(0 0 26px rgba(246,205,99,.22));animation:rise .9s 2.3s both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.door.d3{left:96px}
.door.d5{left:884px}
.door svg.egy{position:absolute;left:0;top:0;width:300px;height:440px;display:block}
.door .st{transition:transform .25s}
.door:hover{filter:drop-shadow(0 10px 0 #12081A) drop-shadow(0 0 34px rgba(246,205,99,.55)) brightness(1.06)}
.door:hover .st{transform:translateY(-6px)}
.door .eye{animation:glint 3.2s 3s infinite}
@keyframes glint{0%,86%,100%{fill:#F2C14E}90%{fill:#FFF8D0}}
.door .lab{position:absolute;left:70px;width:160px;top:312px;color:#5A3A16;text-shadow:0 1px 0 rgba(255,243,210,.85),0 -1px 0 rgba(60,35,10,.4)}
.door b{display:block;font-size:44px;line-height:52px;letter-spacing:6px;font-family:"GP Hand","GP Round",sans-serif;font-weight:normal}
.door span{display:block;font-size:24px;line-height:30px;color:#7A3B1A}
.door .tip{display:block;font-size:17px;line-height:28px;font-style:normal;color:#6B4A22;margin-top:2px}
/* 石碑密語 */

.gp{border-radius:6px;overflow:hidden}
.gp svg{display:block;width:100%;height:auto}
.qq{aspect-ratio:320/200;display:flex;align-items:center;justify-content:center;font-size:60px;color:rgba(205,182,227,.5);font-family:"GP Hand",sans-serif}
.qq{flex-direction:column;gap:6px}
.qq i{font-style:normal;line-height:1}
.buy{border:3px solid var(--brassd);border-radius:12px;background:linear-gradient(#F8D46A,#E3A73A);color:#3A2206;font-size:19px;padding:3px 12px;box-shadow:0 3px 0 var(--brassd)}
.buy:hover{filter:brightness(1.08)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brassd)}
.poor{font-size:17px;color:rgba(231,219,243,.7);font-family:"GP Round",sans-serif}
.gc.fresh{animation:popin .7s}
.gn .bt{font-size:15px;color:#9A6A12}
.hd .wal{font-size:21px;color:#F6CD63;margin-left:10px}
.hd .wal small{font-size:17px;color:#E7DBF3}
.gn{font-size:20px;text-align:center;line-height:1.3;height:30px;overflow:hidden;white-space:nowrap;margin-top:2px}
.fly{position:absolute;bottom:50px;width:34px;height:34px;animation:fly 1.7s ease-out both;pointer-events:none}
@keyframes fly{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-250px) rotate(540deg)}}
#photo{cursor:default}
#photo[data-act]{cursor:pointer}
#photo.blur{transform:scale(.5);transform-origin:top left;filter:blur(3px);transition:transform .4s,filter .4s}
.bigf.tilt{transform:rotate(-2.2deg)}
.cat.tried,.swd.tried{opacity:.4;pointer-events:none;text-decoration:line-through}
/* ===== 2026-11-25 新手教學＋提示：神燈小對話框在操作的東西旁邊 ===== */
#coach{position:absolute;z-index:40;width:400px;display:none;align-items:flex-start;gap:4px;pointer-events:none}
#coach.on{display:flex}
#coach .cl{width:62px;height:48px;flex:none;margin-top:6px;filter:drop-shadow(0 3px 0 #12081A)}
#coach .cl svg{width:62px;height:48px;display:block}
#coach .cbub{pointer-events:auto;flex:1;min-width:0;background:#fff;border:4px solid var(--violet);border-radius:18px;padding:6px 14px 10px;font-size:22px;line-height:1.38;color:#3B1E50;box-shadow:0 0 0 3px rgba(255,255,255,.5),0 10px 24px rgba(0,0,0,.45);position:relative;transition:background .2s,border-color .2s}
#coach .cbub::before{content:'';position:absolute;width:18px;height:18px;background:inherit;border:inherit;border-width:0 0 4px 4px;border-color:inherit;display:none}
#coach[data-s="t"] .cbub::before{display:block;top:-12px;left:calc(var(--a) - 75px);transform:rotate(135deg)}
#coach[data-s="b"] .cbub::before{display:block;bottom:-12px;left:calc(var(--a) - 75px);transform:rotate(-45deg)}
#coach[data-s="r"] .cbub::before{display:block;right:-12px;top:calc(var(--a) - 18px);transform:rotate(-135deg)}
#coach[data-s="l"] .cbub::before{display:block;left:-12px;top:calc(var(--a) - 18px);transform:rotate(45deg)}
#coach.ok .cbub{background:#E3F6E5;border-color:#3E9A57;color:#1F5A2E}
#coach.bad .cbub{background:#FDE4E8;border-color:var(--carpet);color:#7A1426}
#coach.hint .cbub{border-color:var(--brass);background:#FFFBEF}
#coach.ok .cl{animation:cjump .6s}
#coach.bad .cl{animation:cshake .5s}
@keyframes cjump{0%,100%{transform:none}40%{transform:translateY(-18px) rotate(-8deg)}70%{transform:translateY(0) scale(1.1,.9)}}
@keyframes cshake{0%,100%{transform:none}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(6deg)}}
#coach .chd{font-size:17px;color:#8A6AA6;display:flex;gap:10px;align-items:center;justify-content:space-between;line-height:1.5}
#coach .chd span{display:flex;align-items:center;gap:3px;color:#6B4A86}
#coach.ok .chd,#coach.bad .chd{visibility:hidden;height:4px;overflow:hidden}
#coach .chd.hcap{color:#8A5A12;font-size:18px;display:block}
#coach .chd.hcap span{display:inline;font-size:16px;color:#8A6AA6}
.mico{width:15px;height:21px;flex:none;vertical-align:-4px}
#coach .cbt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;justify-content:flex-end}
#coach .cbt .btn{font-size:21px;padding:4px 18px}
#coach .pill{display:inline-block;background:var(--brass);color:#3A2206;border-radius:10px;padding:0 8px;margin-right:6px;font-size:18px}
.hbs{display:flex;gap:6px;width:100%}
.hb{flex:1;border:3px solid var(--brass);border-radius:12px;background:#FFF1C4;padding:3px 2px;line-height:1.15;box-shadow:0 3px 0 var(--brassd);color:#3A2206}
.hb b{display:block;font-size:19px;font-weight:normal}
.hb small{font-size:15px;color:#8A5A12}
.hb.used{background:#F3E7C2}
.hb.on{background:linear-gradient(#FFDD7A,#E3A73A)}
.hb[disabled]{opacity:.4;pointer-events:none;box-shadow:none}
.btn.hbtn{background:linear-gradient(#FFF6DE,#F6E3B0);border-color:var(--brassd);color:#5A3A0A;box-shadow:0 4px 0 var(--brassd);font-size:22px;padding:6px 12px;display:flex;align-items:center;gap:4px;position:relative}
.btn.hbtn svg{width:32px;height:24px}
.btn.hbtn small{position:absolute;right:-8px;top:-10px;background:var(--carpet);color:#fff;border-radius:50%;width:24px;height:24px;font-size:15px;line-height:24px}
.side .btn.hbtn{align-self:flex-start}
.tgt{position:relative;z-index:3;animation:tgtp 1.1s ease-in-out infinite!important}
@keyframes tgtp{0%,100%{box-shadow:0 0 0 3px #F6CD63,0 0 10px 4px rgba(246,205,99,.75)}50%{box-shadow:0 0 0 6px #F6CD63,0 0 22px 10px rgba(246,205,99,.95)}}
#tarr{position:absolute;z-index:39;width:32px;height:30px;display:none;pointer-events:none;background:linear-gradient(#FFDD7A,#E3A73A);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 0 #7A4A0C)}
#tarr.on{display:block;animation:tarr .8s ease-in-out infinite alternate}
@keyframes tarr{from{transform:translateY(-6px)}to{transform:translateY(4px)}}
#ghost{position:absolute;left:0;top:0;width:0;height:0;z-index:45;pointer-events:none;display:none}
#ghost.on{display:block}
#ghost .gp{position:absolute;width:30px;height:40px;opacity:.85;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#ghost .gr{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:4px solid #4FF0B4;border-radius:50%}
#ghost .gc{display:none!important;position:absolute;align-items:center;gap:4px;background:rgba(42,18,56,.92);color:#fff;font-size:18px;padding:3px 10px;border-radius:10px;white-space:nowrap}
#okm{position:absolute;z-index:46;width:72px;height:72px;border-radius:50%;background:#3E9A57;color:#fff;font-size:50px;line-height:72px;text-align:center;pointer-events:none;display:none;box-shadow:0 0 0 5px #fff,0 6px 16px rgba(0,0,0,.4)}
#okm.on{display:block;animation:okm .9s both}
@keyframes okm{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.2)}60%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
/* 教學課的步驟清單 */
.tlh{font-size:19px;color:#6B4A86;margin:-14px 0 -2px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tlist li{display:flex;align-items:center;gap:8px;font-size:20px;line-height:1.2;padding:4px 8px;border-radius:10px;color:#8A7A9A;background:#F3ECF9}
.tlist li b{width:28px;height:28px;flex:none;border-radius:50%;background:#D9CDE6;color:#fff;font-size:17px;line-height:28px;text-align:center;font-weight:normal}
.tlist li.c{background:#FFF1B8;color:#3A2206;box-shadow:inset 0 0 0 3px var(--brass)}
.tlist li.c b{background:var(--brass);color:#3A2206}
.tlist li.d{color:#1F5A2E;background:#E3F6E5}
.tlist li.d b{background:#3E9A57}
#lbs .tlh{margin:0;font-size:19px}
#lbs .tlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
#lbs .tlist li{font-size:19px;padding:3px 6px}
.node.tut{background:#FFF1C4;border-color:var(--brass)}
.node.tut b{color:#8A5A12}
.node.tut.lock{background:rgba(255,255,255,.06);border-color:rgba(205,182,227,.28)}
.node.tut.lock b{color:rgba(231,219,243,.55)}
.hd .btn.sm{white-space:nowrap}
.node.nowt{animation:tgtp 1.1s ease-in-out infinite}
.node.tut.done{background:linear-gradient(#E3F6E5,#C8EBCD);border-color:#3E9A57}
.pbox.tutd h2{color:#2E8048}
/* 恭喜動畫 */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-30px;width:14px;height:22px;border-radius:3px;animation:cfall linear infinite}
@keyframes cfall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(780px) rotate(720deg)}}
.modal.cel{width:760px;padding-top:12px}
.modal.cel .clamp{width:150px;height:112px;margin:0 auto;animation:cjump 1.2s infinite}
.modal.cel .clamp svg{width:100%;height:100%;overflow:visible}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3C4,#F6CD63 45%,#C8963E);box-shadow:0 0 0 8px #fff,0 0 0 13px var(--brass),0 0 40px 10px rgba(246,205,99,.7);margin:10px 0 14px;animation:popin .8s .3s both}
.badge b{font-size:38px;font-weight:normal;font-family:"GP Hand","GP Round",sans-serif;color:#5A3A0A}
.badge span{font-size:17px;color:#7A4A0C}
.modal.rules{width:820px;text-align:left}
.modal.rules h2{text-align:center}
.modal.rules ul{margin:6px 0;padding-left:28px;font-size:25px;line-height:1.55}
.modal.rules li{margin:8px 0}
.modal.rules li svg{width:30px;height:22px;vertical-align:-3px}
.modal.rules .hc{display:inline-block;margin:4px 8px 0 0;padding:1px 10px;border:2px solid var(--brass);border-radius:10px;background:#FFF1C4;font-size:21px}
.modal.rules p{text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.smk .s1,.smk .s2{stroke-dashoffset:0}}
</style>

/* 關卡資料。

   關卡欄位：id、name、type(play 預設／letter／flash／bad／short)、slots 格數、predict 有無預測、tutor 教學關(第一次擦不算次數)、
            care 客人只在乎的欄位（省略＝全部）、fav 畫家最常畫的、extra 額外卡片、tempt 把所有看得到的東西都放進卡片庫（引誘「看到什麼放什麼」）、
            pools 畫家亂猜的範圍、posMode 順序(order)或位置詞(pos)、mw 量詞徽章、intro 畫家第一句話、variants 題庫（每張目標圖一筆，可自行增加）。
   variants：{s:畫, care:[...], text:'客人的信，[關鍵詞]用方括號'}。 */
function A(k,n,c,o){var a={kind:k,count:n,color:c,size:'mid',action:'stand',hat:'none',scarf:'none'};if(o)for(var x in o)a[x]=o[x];return a;}

/* ============================================================
   第二部分：引擎（解析提示詞、畫三張、比對、畫家說明）

var ASP=['kind','count','color','size','action','hat','scarf'];
var CARD={};CARDS.forEach(function(c,i){c.ord=i;CARD[c.id]=c;});

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RND(rng,n){return Math.floor(rng()*n);}
function shuffle(a,rng){a=a.slice();for(var i=a.length-1;i>0;i--){var j=RND(rng,i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function val(x){return(x&&typeof x==='object'&&'v' in x)?x.v:x;}
function nm(asp,v,kind){
  if(asp==='count')return v+(MW[kind]||'隻');
  if(asp==='hat')return v==='none'?'沒戴帽子':NAME.color[v]+'的帽子';
  if(asp==='scarf')return v==='none'?'沒圍圍巾':NAME.color[v]+'的圍巾';
  return(NAME[asp]||{})[v]||String(v);
}
function allKeys(s){var k=['time','place'];s.actors.forEach(function(a,i){ASP.forEach(function(x){k.push('a'+i+'.'+x);});});return k;}
function careOf(v,lv){var keys=v.care||lv.care||allKeys(v.s),o={};keys.forEach(function(k){o[k]=1;});return o;}
function poolOf(asp,lv,v){var p={};[DEFPOOL,lv.pools||{},v.pools||{}].forEach(function(m){for(var k in m)p[k]=m[k];});return p[(asp==='hat'||asp==='scarf')?'color':asp];}

/* 找一張「具體詞」卡 */
function cardFor(asp,v,kind){
  var best=null;
  for(var i=0;i<CARDS.length;i++){var c=CARDS[i];
    if(c.ty!=='good'||c.ap!==asp||c.v!==v)continue;
    if(asp==='count'){if(c.mw===MW[kind])return c;if(!best)best=c;}else return c;}
  return best;
}
/* 標準解法（最少需要的卡，依序） */
function solve(v,lv){
  var tg=v.s,care=careOf(v,lv),T=tg.actors.length,out=[],pm=lv.posMode||'order';
  tg.actors.forEach(function(a,i){
    var p='a'+i+'.',any=false;ASP.forEach(function(x){if(care[p+x])any=true;});
    if(!any)return;
    if(pm==='pos'&&T===2&&i===0)out.push(cardFor('pos','L').id);
    if(care[p+'count'])out.push(cardFor('count',a.count,a.kind).id);
    if(care[p+'size']&&a.size!=='mid')out.push(cardFor('size',a.size).id);
    if(care[p+'color'])out.push(cardFor('color',a.color).id);
    out.push(cardFor('kind',a.kind).id);
    if(care[p+'action']&&a.action!=='stand')out.push(cardFor('action',a.action).id);
    if(care[p+'hat']&&a.hat!=='none'){out.push(cardFor('color',a.hat).id);out.push('hat');}
    if(care[p+'scarf']&&a.scarf!=='none'){out.push(cardFor('color',a.scarf).id);out.push('scarf');}
  });
  if(care.place&&!(lv.fav&&lv.fav.place===tg.place))out.push(cardFor('place',tg.place).id);
  if(care.time&&tg.time!=='day')out.push(cardFor('time',tg.time).id);
  return out;
}
/* 一關的卡片庫（所有目標圖的標準解法聯集＋額外卡＋引誘卡） */
var NEAR={color:{red:'orange',orange:'yellow',yellow:'orange',blue:'white',white:'yellow',black:'blue',pink:'red'},place:{grass:'pond',snow:'beach',beach:'snow',pond:'grass'},kind:{cat:'dog',dog:'cat',rabbit:'cat',bird:'rabbit',fish:'bird',flower:'bird'},time:{day:'night',night:'day'},size:{big:'small',small:'big'}};
function buildPool(lv){
  if(lv._pool)return lv._pool;
  if(lv.pool){lv._pool=lv.pool.slice();return lv._pool;}
  var cnt={};
  function bump(list){var t={};list.forEach(function(id){t[id]=(t[id]||0)+1;});for(var id in t)cnt[id]=Math.max(cnt[id]||0,t[id]);}
  lv.variants.forEach(function(v){
    bump(solve(v,lv));
    if(lv.tempt){var tg=v.s,l=['place','time'].map(function(k){return cardFor(k,tg[k]).id;});
      tg.actors.forEach(function(a){l.push(cardFor('kind',a.kind).id,cardFor('count',a.count,a.kind).id,cardFor('color',a.color).id);
        if(a.size!=='mid')l.push(cardFor('size',a.size).id);if(a.action!=='stand')l.push(cardFor('action',a.action).id);});
      bump(l);}
  });
  var ex={};(lv.extra||[]).forEach(function(id){ex[id]=(ex[id]||0)+1;});for(var id in ex)cnt[id]=Math.max(cnt[id]||0,ex[id]);
  /* 差一點的干擾卡：和目標只差一點，要仔細看圖才分得出 */
  if(!lv.tutor&&lv.type!=='letter0'){
    var tot=0;for(var q in cnt)tot+=cnt[q];
    lv.variants.forEach(function(v){
      if(tot>=24)return;var care=careOf(v,lv),tg=v.s,a=tg.actors[0],added=0,cs=[];
      if(care['a0.count']){var n2=a.count<5?a.count+1:a.count-1;cs.push(cardFor('count',n2,a.kind));}
      if(care['a0.color'])cs.push(cardFor('color',NEAR.color[a.color]));
      if(care.place)cs.push(cardFor('place',NEAR.place[tg.place]));
      if(care['a0.kind'])cs.push(cardFor('kind',NEAR.kind[a.kind]));
      if(care.time)cs.push(cardFor('time',NEAR.time[tg.time]));
      if(care['a0.size']&&a.size!=='mid')cs.push(cardFor('size',NEAR.size[a.size]));
      cs.forEach(function(c){if(!c||added>=2||tot>=24)return;if(cnt[c.id])return;cnt[c.id]=1;tot++;added++;});
    });
  }
  var ids=[];Object.keys(cnt).sort(function(a,b){return CARD[a].ord-CARD[b].ord;}).forEach(function(id){for(var i=0;i<cnt[id];i++)ids.push(id);});
  lv._pool=ids;return ids;
}

/* 解析：卡片順序 → 主角們。顏色／數量／大小／位置接在「下一個名詞」前面，帽子圍巾接在前一個主角（沒有就接後面），動作接前一個主角 */
function parse(cards){
  var P={actors:[],place:null,time:null,dangling:[],pendAct:null},pend={},wait=[];
  function spec(c){return c.ty==='good'?{m:'set',v:c.v,c:c}:{m:'guess',pool:c.pool,c:c};}
  cards.forEach(function(c){
    if(!c||c.ty==='noise')return;
    var ap=c.ap;
    if(ap==='kind'){
      var a={kind:spec(c)};
      ['count','color','size','pos'].forEach(function(k){if(pend[k]){a[k]=pend[k];a[k].to=c.t;}});pend={};
      if(P.pendAct){a.action=P.pendAct;P.pendAct=null;}
      wait.forEach(function(w){a[w.ap]=w.s;});wait=[];
      P.actors.push(a);
    }else if(ap==='count'||ap==='color'||ap==='size'||ap==='pos'){pend[ap]=spec(c);}
    else if(ap==='hat'||ap==='scarf'){
      var col=pend.color;pend.color=null;var s;
      if(col&&col.m==='set')s={m:'set',v:col.v,c:c,cc:col.c,to:c.t,cardsColor:col.c};
      else if(col)s={m:'guess',pool:col.pool,c:col.c};
      else s={m:'guess',pool:null,c:c,bare:true};
      var last=P.actors[P.actors.length-1];if(last)last[ap]=s;else wait.push({ap:ap,s:s});
    }else if(ap==='action'){var l2=P.actors[P.actors.length-1];if(l2)l2.action=spec(c);else P.pendAct=spec(c);}
    else if(ap==='place'||ap==='time'){P[ap]=spec(c);}
  });
  ['count','color','size','pos'].forEach(function(k){if(pend[k])P.dangling.push({ap:k,c:pend[k].c});});
  return P;
}
/* 神燈一次畫三張：沒寫的欄位三張各猜各的，保證至少一張和目標不同 */
function g3(pool,tv,rng){
  var p=shuffle(pool,rng),o=[];
  for(var i=0;i<3;i++)o.push(i<p.length?p[i]:p[RND(rng,p.length)]);
  return o;
}
function slotMaps(acts,T,pm,rng){
  var n=acts.length,maps=[[],[],[]],pg=false,i,p;
  function seq(){var m=[];for(var s=0;s<T;s++)m.push(s<n?s:-1);return m;}
  if(pm==='pos'&&T===2){
    var pl=acts.map(function(a){return a.pos?a.pos.v:null;});
    if(n===0){for(p=0;p<3;p++)maps[p]=[-1,-1];}
    else if(n===1){
      if(pl[0]==='L'){for(p=0;p<3;p++)maps[p]=[0,-1];}
      else if(pl[0]==='R'){for(p=0;p<3;p++)maps[p]=[-1,0];}
      else{pg=true;maps=[[0,-1],[-1,0],RND(rng,2)?[0,-1]:[-1,0]];}
    }else{
      if(pl[0]==='L'||pl[1]==='R'){for(p=0;p<3;p++)maps[p]=[0,1];}
      else if(pl[0]==='R'||pl[1]==='L'){for(p=0;p<3;p++)maps[p]=[1,0];}
      else{pg=true;maps=[[0,1],[1,0],RND(rng,2)?[0,1]:[1,0]];}
    }
  }else{for(p=0;p<3;p++)maps[p]=seq();}
  return{maps:maps,pg:pg};
}
function REGORDER(r){return r==='sky'?0:r==='ground'?9:1+parseInt(r.slice(1),10);}
function why(asp,x,ctx){
  var s=x.src,d=nm(asp,x.v,ctx.kind),pre=ctx.who?ctx.who+'：':'',tn=nm(asp,ctx.tv,ctx.tk||ctx.kind);
  switch(s.k){
    case'set':if(s.to&&(asp==='color'||asp==='hat'||asp==='scarf'))return pre+'你把「'+(s.cc||s.c).t+'」放在「'+s.to+'」前面，所以我畫成'+d+'。客人要的是'+tn+'。';
      return pre+'客人要'+tn+'，你寫的是'+(s.c.t)+'。';
    case'guess':return pre+(s.c.msg?s.c.msg.replace('{v}',d):'「'+s.c.t+'」是哪一種？我不確定，就猜了'+d+'。');
    case'none':return pre+'你沒說'+FIELD[asp]+'，我隨便畫了'+d+'。';
    case'plain':return pre+'你沒說'+FIELD[asp]+'，我就畫'+d+'。客人要的是'+tn+'。';
    case'fav':return pre+'你沒說'+FIELD[asp]+'，我最常畫'+d+'。客人要的是'+tn+'。';
    case'dang':return pre+'「'+s.c.t+'」後面沒有接東西，我不知道要用在誰身上，就畫了'+d+'。';
  }
  return pre+'這裡和目標不一樣。';
}
function groupText(asp,x,ctx){
  var s=x.src,pre=ctx.who?ctx.who+'：':'';
  if(s.k==='none'||s.k==='dang')return pre+'你沒說'+FIELD[asp]+'，三張我各畫了：';
  if(s.k==='guess')return pre+'「'+s.c.t+'」我不確定，三張各猜了：';
  return null;
}
/* 核心：一組卡片 → 三張畫＋比對結果 */
function runPrompt(cards,lv,v,rng){
  rng=rng||Math.random;
  var tg=v.s,T=tg.actors.length,care=careOf(v,lv),P=parse(cards);
  var acts=P.actors.slice(0,T);if(!acts.length)acts=[{}];
  var sm=slotMaps(acts,T,lv.posMode||'order',rng);
  function R(key,asp,sp,tv){
    var i;
    if(!care[key])return[0,1,2].map(function(){return{v:tv,src:{k:'free'}};});
    if(sp&&sp.m==='set')return[0,1,2].map(function(){return{v:sp.v,src:{k:'set',c:sp.c,cc:sp.cc,to:sp.to}};});
    if(sp&&sp.m==='guess')return g3(sp.pool||poolOf(asp,lv,v),tv,rng).map(function(x){return{v:x,src:{k:'guess',c:sp.c}};});
    var dg=null;for(i=0;i<P.dangling.length;i++)if(P.dangling[i].ap===asp)dg=P.dangling[i];
    if(asp in PLAIN)return[0,1,2].map(function(){return{v:PLAIN[asp],src:{k:'plain'}};});
    if(key==='place'&&lv.fav&&lv.fav.place)return[0,1,2].map(function(){return{v:lv.fav.place,src:{k:'fav'}};});
    return g3(poolOf(asp,lv,v),tv,rng).map(function(x){return{v:x,src:dg?{k:'dang',c:dg.c}:{k:'none'}};});
  }
  var G={place:R('place','place',P.place,tg.place),time:R('time','time',P.time,tg.time)};
  var AR=acts.map(function(a,ai){var o={};ASP.forEach(function(x){var tv=ai<T?tg.actors[ai][x]:null;o[x]=R('a'+ai+'.'+x,x,a[x],tv);});return o;});
  var pics=[],red={},pass=true;
  for(var p=0;p<3;p++){
    var sc={place:G.place[p],time:G.time[p],slots:[]},diffs=[];
    function add(region,key,text,gp,gv){diffs.push({region:region,key:key,text:text,gp:gp,gv:gv});}
    if(!(care.place?G.place[p].v===tg.place:true))add('ground','place',why('place',G.place[p],{tv:tg.place}),groupText('place',G.place[p],{}),nm('place',G.place[p].v));
    if(!(care.time?G.time[p].v===tg.time:true))add('sky','time',why('time',G.time[p],{tv:tg.time}),groupText('time',G.time[p],{}),nm('time',G.time[p].v));
    for(var s=0;s<T;s++){
      var ai=sm.maps[p][s],ta=tg.actors[s],pre='a'+s+'.',who=T===2?(s===0?'左邊':'右邊'):'',hasCare=false,sd=[];
      ASP.forEach(function(x){if(care[pre+x])hasCare=true;});
      if(ai<0){sc.slots.push(null);if(hasCare)sd.push({region:'a'+s,key:pre+'who',text:(who?who+'：':'')+'你沒說這裡要畫誰，所以我沒畫。'});}
      else{
        var ac={};ASP.forEach(function(x){ac[x]=AR[ai][x][p];});sc.slots.push(ac);
        ASP.forEach(function(x){
          if(!care[pre+x])return;
          if(ac[x].v!==ta[x])sd.push({region:'a'+s,key:pre+x,text:why(x,ac[x],{who:who,kind:ac.kind.v,tv:ta[x],tk:ta.kind}),gp:groupText(x,ac[x],{who:who}),gv:nm(x,ac[x].v,ac.kind.v)});
        });
        if(sm.pg&&sd.length)sd=[{region:'a'+s,key:pre+'pos',text:'左邊右邊你沒說清楚，我隨便排。'}];
      }
      diffs=diffs.concat(sd);
    }
    diffs.sort(function(a,b){return REGORDER(a.region)-REGORDER(b.region);});
    var regs=[];diffs.forEach(function(d){if(regs.indexOf(d.region)<0)regs.push(d.region);red[d.region]=1;});
    if(diffs.length)pass=false;
    pics.push({sc:sc,diffs:diffs,regs:regs});
  }
  return{pics:pics,pass:pass,red:red,care:care,sm:sm};
}

function pickWrong(wn,rng){var a=['你寫'+wn+'，我就畫'+wn+'啊～（對客人吐舌頭）','字面上寫'+wn+'，我就給你'+wn+'～略略略！','你自己寫的是'+wn+'喔，不能怪我～','寫'+wn+'？好，馬上送上'+wn+'！'];return a[RND(rng,a.length)];}
function fillLn(s,t,n){return s.replace('{t}',t||'').replace('{n}',n==null?'':n);}
function prKey(f,ta){
  var a=f.asp,t=f.type;
  if(a==='kind')return t==='super'?'kind.super':'kind.miss';
  if(a==='count')return t==='vague'?(f.card&&f.card.id==='v_many'?'count.many':'count.some'):'count.miss';
  if(a==='color')return(t==='vague'||t==='super')?'color.vague':'color.miss';
  if(a==='place')return t==='vague'?'place.vague':t==='super'?'place.super':'place.miss';
  if(a==='time')return'time.miss';
  if(a==='size')return ta&&ta.size==='small'?'size.small':'size.big';
  if(a==='action')return'action.miss';
  if(a==='hat')return'hat.miss';
  if(a==='scarf')return'scarf.miss';

}
/* 抽一個整人方式：不和上一次同一個（last 是 prKey→上次的編號） */
function pickPR(prk,last,rng,tcount){
  var L=PR[prk],ok=[],i;
  for(i=0;i<L.length;i++){if(L[i].n_!=null&&L[i].n_===tcount)continue;if(last&&last[prk]===i&&L.length>1)continue;ok.push(i);}
  if(!ok.length)ok=L.map(function(_,k){return k;});
  var k=ok[RND(rng,ok.length)];if(last)last[prk]=k;return k;
}
/* 許願：卡片 → 神燈怎麼整你。pass＝完全沒漏洞。flaws＝要演出的漏洞（最多 3 個，除非 all），all＝全部漏洞 */
function wish(cards,lv,v,rng,last,all){
  rng=rng||Math.random;last=last||{};
  var r=runPrompt(cards,lv,v,rng),P=parse(cards),tg=v.s,keys=[],fl=[];
  r.pics.forEach(function(p){p.diffs.forEach(function(d){var k=d.key.replace(/\.who$/,'.kind').replace(/^a\d\.pos$/,'pos');if(keys.indexOf(k)<0)keys.push(k);});});
  keys.forEach(function(k){
    var f={key:k,asp:null,type:'miss',ai:null},sp,x,N;
    if(k==='pos'){f.asp='pos';f.type='pos';fl.push(f);return;}
    if(k==='place'||k==='time'){f.asp=k;sp=P[k];}
    else{N=parseInt(k.charAt(1),10);x=k.split('.')[1];f.asp=x;f.ai=N;
      var wi=r.sm.maps[0][N];
      if(wi==null||wi<0){f.type='who';fl.push(f);return;}
      sp=P.actors[wi]?P.actors[wi][x]:undefined;
      if(x==='hat'||x==='scarf'){for(var s=0;s<tg.actors.length;s++){var wj=r.sm.maps[0][s];if(s!==N&&wj>=0&&P.actors[wj]&&P.actors[wj][x]){f.otherSlot=s;}}}
    }
    if(sp){
      if(sp.m==='set'){f.type='wrong';f.wrote=sp.v;f.card=sp.c;f.cc=sp.cc;}
      else{f.card=sp.c;f.type=sp.c.ty==='vague'?'vague':sp.c.ty==='super'?'super':'miss';}
    }else{
      for(var q=0;q<P.dangling.length;q++)if(P.dangling[q].ap===f.asp){f.type='dang';f.card=P.dangling[q].c;}
    }
    fl.push(f);
  });
  fl.sort(function(a,b){return FPRI[a.asp]-FPRI[b.asp];});
  var noise=cards.some(function(c){return c&&c.ty==='noise';});
  var use=all?fl:fl.slice(0,3);
  use.forEach(function(f){
    var ta=f.ai!=null?tg.actors[f.ai]:null,kindN=ta?NAME.kind[ta.kind]:'';
    f.mood=MOOD[f.asp]||'laugh';
    if(f.type==='wrong'){
      var wn=nm(f.asp,f.wrote,ta?ta.kind:null);f.id='wrong';f.pr=null;f.n='照字面畫';
      var tv=f.asp==='place'||f.asp==='time'?tg[f.asp]:ta[f.asp];
      var tn=nm(f.asp,tv,ta?ta.kind:null);f.cust='我要'+tn+'！你給我'+wn+'是怎樣！';f.mood='angry';f.tongue=true;
      if(f.asp==='color'&&ta&&f.wrote!==tv&&(f.wrote===ta.hat||f.wrote===ta.scarf))f.ln='你說'+nm('color',f.wrote)+'的是'+kindN+'，不是'+(f.wrote===ta.hat?'帽子':'圍巾')+'喔～';
      else f.ln=pickWrong(wn,rng);
    }else if(f.type==='who'){
      var pk=PR['kind.miss'],ix=pickPR('kind.miss',last,rng,null),pw=pk[ix];f.pr='kind.miss';f.id=pw.id;f.n=pw.n;f.ln='這裡你沒說要畫誰～'+pw.ln;
    }else{
      var prk=prKey(f,ta),L=PR[prk];f.pr=prk;
      var hasOther=(f.asp==='hat'||f.asp==='scarf')&&f.otherSlot!=null;
      if(hasOther){f.id='other';f.n='戴到別人頭上';f.forced=true;var on=NAME.kind[tg.actors[f.otherSlot].kind];f.ln=(f.asp==='hat'?'帽子':'圍巾')+'？我給'+on+'戴～你沒說清楚是誰戴喔！';}
      else{var idx=pickPR(prk,last,rng,ta?ta.count:null),pv=L[idx];f.id=pv.id;f.n=pv.n;f.vn=pv.n_;f.ln=fillLn(pv.ln,f.card?f.card.t:'',pv.n_);
        if(rng()<.4){var gl=(f.type==='vague'||f.type==='super')?GEN.vague:GEN[f.asp];if(gl)f.ln=fillLn(gl[RND(rng,gl.length)],f.card?f.card.t:'',null);}}
      if(f.type==='dang')f.ln='「'+f.card.t+'」什麼？'+f.card.t.replace(/的$/,'')+'空氣嗎？';
    }
  });
  return{pass:r.pass,flaws:use,all:fl,noise:noise,run:r};
}

/* ============================================================
   第二部分之三：提示一、二、三（2026-11-25，照 claude-rules/60-game-teaching.md）
   提示一免費；用了提示二這關最多 2 枚金幣；用了提示三最多 1 枚；過關至少 1 枚。
   ============================================================ */
function hintCap(n){return n>=3?1:n>=2?2:99;}
function capCoins(c,n){return Math.max(1,Math.min(c,hintCap(n)));}
var CATN={kind:'是誰',count:'幾隻',color:'什麼顏色',size:'多大',action:'在做什麼',hat:'帽子',scarf:'圍巾',place:'在哪裡',time:'白天還是晚上',pos:'左右位置'};
/* 換手關：句子裡的某張卡對應到哪一個漏洞欄位 */
function cardKeyOf(P,c){
  var i,x,ASPS=['kind','count','color','size','action','hat','scarf','pos'];
  if(!c||c.ty==='noise')return null;
  if(P.place&&(P.place.c===c))return'place';if(P.time&&P.time.c===c)return'time';
  for(i=0;i<P.actors.length;i++)for(var j=0;j<ASPS.length;j++){x=ASPS[j];var s=P.actors[i][x];if(s&&(s.c===c||s.cc===c))return x==='pos'?'pos':'a'+i+'.'+x;}
  return null;
}
/* 提示一：方向（這關要注意什麼），不給答案 */
function hint1(lv){
  var t=lv.type||'play',s;
  if(t==='swap')return'比一比客人的畫和別人寫的願望：句子裡有沒有說不清楚的詞？畫上看得到、句子卻沒寫到的，又是什麼？';
  if(t==='bad')return'先看左邊：神燈把畫弄錯了哪一樣？再到句子裡找跟那一樣有關的詞。';
  if(t==='letter')s='信裡跟畫有關的詞才是重點，把重點變成卡片；跟畫無關的話不用放。';
  else if(t==='flash')s='照片只給你看幾秒，先記住：是誰、幾隻、什麼顏色、在哪裡。';
  else if(t==='mosaic')s='照片太糊就按「看清楚一點」，看懂了就不用再按，按越少次金幣越多。';
  else if(t==='short')s='格子很少，只寫客人在乎的那幾樣，其他都不用寫。';
  else if(lv.fav)s='神燈說過牠最常畫「'+NAME.place[lv.fav.place]+'」。'+NAME.place[lv.fav.place]+'不用寫，把格子留給別的東西。';
  else if(lv.tempt)s='看得到的不一定都要寫，先看客人在乎什麼。';
  else s='比一比照片和你的願望：客人在乎的每一樣，都寫了嗎？';
  if(lv.posMode==='order')s+='兩隻動物照順序寫，先寫左邊那一隻。';
  if(lv.posMode==='pos')s+='兩隻動物要用「左邊的」說清楚誰在左邊。';
  if(lv.mw)s+='量詞也要注意：魚用「條」、花用「朵」。';
  return s+'不要用「一些」「漂亮的顏色」這種說不清楚的詞。';
}
function flawWord(f){var n=CATN[f.asp]||'';if(f.type==='who')return'少寫了一隻動物';if(f.type==='vague'||f.type==='super')return'「'+n+'」說得不清楚';if(f.type==='wrong')return'「'+n+'」寫錯了';if(f.type==='dang')return'「'+n+'」放錯位置';return'沒寫「'+n+'」';}
/* 提示二：做法（要寫哪幾樣、照什麼順序；現在的願望哪裡有問題） */
function hint2(lv,v,cards){
  var sol=solve(v,lv),names=[];
  sol.forEach(function(id,i){var c=CARD[id],nx=sol[i+1]?CARD[sol[i+1]]:null;
    if(c.ap==='color'&&nx&&(nx.ap==='hat'||nx.ap==='scarf'))return;
    var n=c.ap==='hat'||c.ap==='scarf'?CATN[c.ap]+'（和它的顏色）':CATN[c.ap];if(n&&names.indexOf(n)<0)names.push(n);});
  var s='這位客人的願望要寫 '+sol.length+' 張卡：'+names.join(' → ')+'（照這個順序）。';
  var cs=(cards||[]).filter(function(c){return c;});
  if(cs.length){var w=wish(cs,lv,v,mulberry(7),{},true);
    if(w.pass)s+='你現在的願望已經沒有漏洞了！';
    else{var ws=[];w.all.forEach(function(f){var x=flawWord(f);if(ws.indexOf(x)<0)ws.push(x);});s+='你現在的願望：'+ws.join('、')+'。';}
    if(cs.some(function(c){return c.ty==='noise';}))s+='「可愛」「很棒」這種詞跟畫無關，不用放。';}
  return s;
}
/* 提示三：直接說下一步。slots＝格子裡的卡（id 或 null，含空格），tray＝抽屜裡還有的卡 id */
function hint3(lv,v,slots,tray){
  var sol=solve(v,lv),k,j;
  for(k=0;k<slots.length;k++){
    var want=sol[k],have=slots[k];
    if(want===undefined){if(have)return{k:'unpick',i:k,t:'「'+CARD[have].t+'」不用放，點它拿回來。'};continue;}
    if(have===want)continue;
    if(have)return{k:'unpick',i:k,t:'願望格第 '+(k+1)+' 張「'+CARD[have].t+'」不對，點它拿回來。'};
    if(tray.indexOf(want)>=0)return{k:'pick',id:want,i:k,t:'下一張放「'+CARD[want].t+'」。'};
    for(j=k+1;j<slots.length;j++)if(slots[j]===want)return{k:'unpick',i:j,t:'「'+CARD[want].t+'」放的位置不對，先點它拿回來，再照順序放。'};
    return{k:'pick',id:want,i:k,t:'下一張放「'+CARD[want].t+'」。'};
  }
  return{k:'rub',t:'願望寫好了！按「許願！」'};
}
/* 換手關的提示 */
function swapHint2(sw){
  var rem=sw.w.all.filter(function(f){return sw.found.indexOf(f.key)<0;}),inS=0;
  rem.forEach(function(f){if(sw.cards.some(function(c){return cardKeyOf(sw.P,c)===f.key;}))inS++;});
  return'還有 '+rem.length+' 個漏洞：'+[inS?inS+' 個在句子裡（說不清楚、寫錯的詞，點那個詞）':'',rem.length-inS?(rem.length-inS)+' 個是畫上有、句子沒寫到的（點下面的類別）':''].filter(function(x){return x;}).join('；')+'。';
}
function swapHint3(sw){
  var rem=sw.w.all.filter(function(f){return sw.found.indexOf(f.key)<0;});if(!rem.length)return null;
  var f=rem[0];
  for(var k=0;k<sw.cards.length;k++)if(cardKeyOf(sw.P,sw.cards[k])===f.key)return{k:'swcard',i:k,t:'點句子裡的「'+sw.cards[k].t+'」，它是漏洞。'};
  var c=swKeyCat(f.key);return{k:'swcat',c:c,t:'畫上有、願望沒寫到的是「'+SW_CAT_NAME[c]+'」，點下面的「'+SW_CAT_NAME[c]+'」。'};
}
/* 找出壞詞的提示 */
function badHint2(v){var c=CARD[v.prompt[v.culprit]];return'神燈整的是「'+CATN[c.ap]+'」這一樣。去句子裡找跟「'+CATN[c.ap]+'」有關的詞。';}
function badHint3(v){var c=CARD[v.prompt[v.culprit]];return{k:'bad',i:v.culprit,t:'就是「'+c.t+'」！換成「'+CARD[v.fix].t+'」就不會被整了。點它。'};}

/* 解鎖：照順序，新手教學每一課都完成才開第 2 章；挑戰章要主線全部完成 */
function tutLessons(g){return LEVELS[g].chapters[0].levels.filter(function(l){return l.tut;});}
function mainList(g){var o=[];LEVELS[g].chapters.forEach(function(ch){ch.levels.forEach(function(l){l.ch=ch.id;o.push(l);});});return o;}
function lvUnlocked(g,recs,l){var m=mainList(g),i=m.indexOf(l);if(i>=0)return i===0||!!recs[m[i-1].id];return m.every(function(x){return!!recs[x.id];});}

/* ============================================================
   第三部分：自動檢查（?selftest=1，改版規格第七節七項）
   ============================================================ */
function playables(g){var o=[];LEVELS[g].chapters.forEach(function(ch){ch.levels.forEach(function(l){l.ch=ch.id;o.push(l);});});LEVELS[g].challenge.forEach(function(l){l.ch='C';o.push(l);});return o;}
function certKind(l){return l.type==='letter'?'letter':l.type==='flash'?'flash':l.type==='mosaic'?'mosaic':l.type==='bad'?'bad':l.type==='swap'?'swap':'play';}
function certPlan(g,rng){
  var by={};playables(g).forEach(function(l){if(l.tutor||l.tut)return;var k=certKind(l);if(k==='play'&&!(l.ch==='C'||l.ch>=2))return;(by[k]=by[k]||[]).push(l);});
  var out=[];Object.keys(CERT_MIX).forEach(function(k){var pool=shuffle(by[k]||[],rng);for(var i=0;i<CERT_MIX[k];i++)if(pool.length)out.push(pool[i%pool.length]);});
  return shuffle(out,rng);
}
function rubbable(l){return l.type!=='bad'&&l.type!=='swap';}
function chIsLate(l){return typeof l.ch==='number'&&l.ch>=3&&l.type!=='letter'&&l.type!=='swap';}
function greedy(lv,v,pool){
  var tg=v.s,tk=[['time',tg.time]];
  tg.actors.forEach(function(a){
    tk.push(['count',a.count,a.kind]);if(a.size!=='mid')tk.push(['size',a.size]);tk.push(['color',a.color]);tk.push(['kind',a.kind]);
    if(a.action!=='stand')tk.push(['action',a.action]);
    if(a.hat!=='none'){tk.push(['color',a.hat]);tk.push(['hat',true]);}
    if(a.scarf!=='none'){tk.push(['color',a.scarf]);tk.push(['scarf',true]);}
  });
  tk.push(['place',tg.place]);
  var left=pool.slice(),out=[];
  tk.forEach(function(t){var c=cardFor(t[0],t[1],t[2]);if(!c)return;var i=left.indexOf(c.id);if(i<0)return;left.splice(i,1);out.push(c);});
  return out.slice(0,lv.slots);
}
function concreteFirst(lv,pool){return pool.filter(function(id){return CARD[id].ty==='good';}).slice(0,lv.slots).map(function(id){return CARD[id];});}
function trapFor(sol,pool){
  for(var i=0;i<sol.length;i++){
    var c=CARD[sol[i]];if(c.ap==='pos'||c.ap==='hat'||c.ap==='scarf')continue;
    for(var j=0;j<pool.length;j++){var t=CARD[pool[j]];
      if(t.id===c.id||t.ap!==c.ap)continue;
      if(t.ty==='good'&&t.v===c.v)continue;
      var r=sol.slice();r[i]=t.id;return{idx:i,ids:r};}
  }

    drawMos();};

function drawMos(){
  var cv=$('mos');if(!cv)return;var x=cv.getContext('2d'),W=640,H=400;
  if(!S.mosData&&!S.mosFb){x.fillStyle='#cfc4a4';x.fillRect(0,0,W,H);return;}
  var lvl=Math.min(S.mosC,GP.MOSAIC.cols.length-1),cols=GP.MOSAIC.cols[lvl],rows=Math.round(cols*H/W),bw=W/cols,bh=H/rows,r,c,yy,xx;
  if(S.mosFb){var t=document.createElement('canvas');t.width=cols;t.height=rows;t.getContext('2d').drawImage(S.mosFb,0,0,cols,rows);x.imageSmoothingEnabled=false;x.drawImage(t,0,0,cols,rows,0,0,W,H);return;}
  var d=S.mosData.data;
  for(r=0;r<rows;r++)for(c=0;c<cols;c++){
    var x0=Math.floor(c*bw),x1=Math.floor((c+1)*bw),y0=Math.floor(r*bh),y1=Math.floor((r+1)*bh),R=0,G=0,B=0,n=0;
    for(yy=y0;yy<y1;yy++)for(xx=x0;xx<x1;xx++){var k=(yy*W+xx)*4;R+=d[k];G+=d[k+1];B+=d[k+2];n++;}
    x.fillStyle='rgb('+Math.round(R/n)+','+Math.round(G/n)+','+Math.round(B/n)+')';x.fillRect(x0,y0,x1-x0,y1-y0);}
}

/* ---------- 許願 ---------- */
function coinsFor(rubs,min,late){var c=rubs<=1?3:rubs===2?2:1;if(late)c=Math.max(1,c-1);return c+(min?1:0);}
function doRub(){
  var lv=S.lv,v=S.v;if(S.phase!=='play')return;
  var cards=curCards(),w=GP.wish(cards,lv,v,Math.random,S.last);S.prank=w;S.total++;
  sfx('magic',.5);if(w.pass)sfx('win',.6,1.1);else sfx('boing',.55,.9);
  if(!(lv.tutor&&S.total===1&&!w.pass))S.rubs++;
  S.fresh=true;S.holdUntil=Date.now()+6000;
  S.prank.mood=w.pass?'happy':(w.flaws.some(function(f){return f.mood==='angry';})?'angry':w.flaws[0].mood);
  var wr=w.flaws.filter(function(f){return f.cust;})[0];
  S.prank.q=w.pass?pickQ('happy'):(wr?wr.cust:pickQ(S.prank.mood));
  if(w.pass){var jk=pickOf(JOKES);S.prank.joke=jk.id;S.prank.lamp=jk.ln;}
  galAdd(w.flaws);
  if(w.pass){finishPass(cards);}
  else{
    S.say='';
    if(S.rubs>=S.maxRubs){S.phase=S.cert?'certnext':'fail';if(S.cert)S.earn={ok:false};sfx('fail',.5,2.6);}
  }

}
function finishPass(cards){
  var lv=S.lv,v=S.v,sol=GP.solve(v,lv),min=cards.length===sol.length;
  var e={coins:lv.type==='mosaic'?GP.mosaicCoins(S.mosC,S.rubs):coinsFor(S.rubs,min,S.late),cards:cards.length,minN:sol.length,min:min,pen:min,pro:false,mw:!!lv.mw&&GP.mwOk(cards,v),hl:lv.type==='letter'&&S.hl.ok};

/* 發金幣：教學課不計金幣；正式關套用提示上限（用了提示二最多 2 枚、提示三最多 1 枚，至少 1 枚） */

  var c=GP.capCoins(e.coins,S.hint||0);if(c<e.coins)e.capBy=true;e.coins=c;return e;
}

/* ============================================================
   新手教學＋提示一二三（2026-11-25，照 claude-rules/60-game-teaching.md 二之一）
   神燈小對話框（#coach）出現在要操作的東西旁邊；做對變綠、做錯變紅並說怎麼改；
   卡住 15 秒換成詳細說明，幽靈滑鼠在真的卡片／按鈕上示範。
   ============================================================ */
(function(){['coach','ghost','tarr','okm'].forEach(function(id){var d=document.createElement('div');d.id=id;stage.appendChild(d);});
  $('ghost').innerHTML='<i class="gr"></i><svg class="gp" viewBox="0 0 24 32"><path d="M3 2V25L9 19.5L13 29L17.5 27L13.5 17.8H21Z" fill="#fff" stroke="#1C0C27" stroke-width="2" stroke-linejoin="round"/></svg><span class="gc"></span>';
  $('okm').textContent='✔';})();
var MOUSE='<svg class="mico" viewBox="0 0 20 28"><rect x="1.5" y="1.5" width="17" height="25" rx="8.5" fill="#fff" stroke="#3B1E50" stroke-width="2"/><path d="M10 1.5V12H1.5V10A8.5 8.5 0 0 1 10 1.5Z" fill="#E5483D" stroke="#3B1E50" stroke-width="2"/><path d="M10 1.5V12" stroke="#3B1E50" stroke-width="2"/></svg>';
function stRect(el){var sr=stage.getBoundingClientRect(),s=sr.width/1280||1,r=el.getBoundingClientRect();return{x:(r.left-sr.left)/s,y:(r.top-sr.top)/s,w:r.width/s,h:r.height/s};}
function ovl(a,b){var x=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)),y=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));return x*y;}
/* 對話框放在目標旁邊：上下左右四個位置挑一個，不蓋住目標、少蓋住願望格與照片 */
function placeCoach(el,tr,keep){
  var w=el.offsetWidth,h=el.offsetHeight,G=16,cx=tr.x+tr.w/2,cy=tr.y+tr.h/2,best=null;
  [{x:cx-w/2,y:tr.y+tr.h+G,s:'t'},{x:cx-w/2,y:tr.y-h-G,s:'b'},{x:tr.x-w-G,y:cy-h/2,s:'r'},{x:tr.x+tr.w+G,y:cy-h/2,s:'l'}].forEach(function(c,i){
    var x=Math.max(6,Math.min(1274-w,c.x)),y=Math.max(62,Math.min(714-h,c.y)),R={x:x,y:y,w:w,h:h},sc=ovl(R,tr)*20+Math.abs(x-c.x)+Math.abs(y-c.y)*2+i*40;
    keep.forEach(function(k){sc+=ovl(R,k.r)*k.wt;});
    if(!best||sc<best.sc)best={x:x,y:y,s:c.s,sc:sc};});
  el.style.left=best.x+'px';el.style.top=best.y+'px';
  var ax=best.s==='t'||best.s==='b'?Math.max(26,Math.min(w-26,cx-best.x)):Math.max(20,Math.min(h-20,cy-best.y));
  el.setAttribute('data-s',best.s);el.style.setProperty('--a',ax+'px');
}
function keepRects(tg,ks){var o=[];(ks||[['#cR .slots',3],['#cR .row2',3],['#photo',2],['#cR .letter',2],['#cR .sent',3],['#cR .pbox',1],['#cBig',.4]]).forEach(function(q){var e=document.querySelector(q[0]);if(e&&e!==tg)o.push({r:stRect(e),wt:q[1]});});return o;}
function clearTgt(){Array.prototype.forEach.call(document.querySelectorAll('.tgt'),function(e){e.classList.remove('tgt');});var a=$('tarr');if(a)a.className='';}
function coachOff(){var c=$('coach');if(c){c.className='';c.innerHTML='';}ghostOff();clearTgt();}
/* o：{mode:say|ok|bad|hint, html, head, btns, target（要操作的東西，會發亮＋箭頭）, anchor（對話框貼著誰）, ghost, gtext} */
function coachShow(o){

  c.innerHTML='<div class="cl">'+LAMP+'</div><div class="cbub">'+(o.head||'')+'<div class="ctx">'+o.html+'</div>'+(o.btns?'<div class="cbt">'+o.btns+'</div>':'')+'</div>';
  var anc=o.anchor||o.target;
  if(anc)placeCoach(c,stRect(anc),keepRects(o.target,o.keep));else{c.style.left='440px';c.style.top='300px';c.setAttribute('data-s','n');}
  if(o.target&&o.mode!=='ok'){o.target.classList.add('tgt');var tr=stRect(o.target),a=$('tarr');a.style.left=(tr.x+tr.w/2-16)+'px';a.style.top=(tr.y-38)+'px';a.className='on';}

/* 幽靈滑鼠：從右下滑到目標、按一下、圈圈擴散（看得到、點不到；學生按下滑鼠時先躲起來） */

    GH.anims.push(ring.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(.3)',opacity:0,offset:.46},{transform:'scale(1)',opacity:.95,offset:.5},{transform:'scale(1.8)',opacity:0,offset:.7},{opacity:0}],{duration:D,iterations:Infinity}));}catch(e){}
}

function okMark(r){if(!r)return;var m=$('okm');m.style.left=(r.x+r.w/2-36)+'px';m.style.top=(r.y+r.h/2-36)+'px';m.className='';void m.offsetWidth;m.className='on';}

/* ---------- 新手教學的流程 ---------- */
var T={st:null};window.__gpT=T;
var PRAISE=['做對了！','沒錯！','好棒！','對了！','就是這樣！'];
var BUILD_SAY={kind:'照片裡是誰？點那張動物卡。',count:'照片裡有幾隻？數一數，點那張數字卡。',color:'牠是什麼顏色？點那張顏色卡（顏色要放在動物前面）。',place:'牠們在哪裡？點那張地點卡。',time:'天空是白天還是晚上？點那張卡。',size:'牠是大的還是小的？點那張卡（大小也放在動物前面）。',action:'牠在做什麼？點那張卡（動作放在動物後面）。'};
var BUILD_SAY_L={kind:'信裡說是誰？點那張卡。',count:'信裡說要幾隻？點那張數字卡。',color:'信裡說什麼顏色？點那張顏色卡（顏色放在動物前面）。',place:'信裡說在哪裡？點那張卡。',time:'信裡說白天還是晚上？點那張卡。'};
function tutSteps(lv,v){var o=[];lv.steps.forEach(function(s){
  if(s.k==='build')GP.solve(v,lv).forEach(function(id){var c=CARD[id],tb=lv.type==='letter'?BUILD_SAY_L:BUILD_SAY;o.push({k:'pick',id:id,say:tb[c.ap]||'點「'+c.t+'」。',more:'點下面抽屜裡寫著「'+c.t+'」的卡。'});});
  else o.push(s);});return o;}
function stepName(s){var c=s.id?CARD[s.id]:null;return{pick:'放「'+(c&&c.t)+'」',unpick:'拿回「'+(c&&c.t)+'」',rub:'按「許願！」',ack:'看神燈怎麼整你',blur:'看清楚照片',peek:'點照片再看一次',hl:'畫出信的重點',hlcheck:'按「畫好重點了」',swcard:'點「'+(c&&c.t)+'」',swcat:'點「'+(s.c&&GP.SW_CAT_NAME[s.c])+'」',swall:'找出剩下的漏洞'}[s.k]||'';}
function tutInit(){T.st={steps:tutSteps(S.lv,S.v),i:0,mode:'say',msg:'',stuck:S.lv.id==='T1',tm:[]};tutArm();}
function tutStop(){if(T.st){T.st.tm.forEach(clearTimeout);T.st=null;}}
function tutLater(f,ms){var st=T.st;if(!st)return;st.tm.push(setTimeout(function(){if(T.st===st)f();},ms));}
function tutArm(){var st=T.st;if(!st)return;var i=st.i;st.mode='say';st.stuck=S.lv.id==='T1';
  tutLater(function(){if(T.st.i===i&&T.st.mode!=='ok'){T.st.stuck=true;if(T.st.mode==='say')tutRender();}},15000);}
function tutListInner(){var st=T.st;if(!st)return'';var h='';st.steps.forEach(function(s,i){var d=i<st.i||(i===st.i&&st.mode==='ok')||S.phase==='pass',c=!d&&i===st.i;h+='<li class="'+(d?'d':c?'c':'')+'"><b>'+(d?'✔':i+1)+'</b>'+esc(stepName(s))+'</li>';});return h;}
function tutList(){return'<div class="tlh">這一課的步驟</div><ol class="tlist" id="tlist">'+tutListInner()+'</ol>';}
function poolU(id){var used={};S.slots.forEach(function(u){if(u)used[u]=1;});var p=S.pool.filter(function(x){return x.id===id&&!used[x.u];})[0];return p?p.u:null;}
function poolId(u){var p=S.pool.filter(function(x){return x.u===u;})[0];return p?p.id:null;}
function q1(sel){return document.querySelector(sel);}
function nextKeySeg(){var segs=letterSegs(S.v.text);for(var i=0;i<segs.length;i++)if(segs[i].k&&!S.hl.sel[i])return i;return-1;}
function tutTarget(s){
  switch(s.k){
    case'pick':{var u=poolU(s.id);return u?q1('#cR .tray [data-u="'+u+'"]'):null;}
    case'unpick':{for(var k=0;k<S.slots.length;k++)if(S.slots[k]&&poolId(S.slots[k])===s.id)return q1('[data-act="unpick"][data-s="'+k+'"]');return null;}
    case'rub':return q1('#cR .btn.rub');
    case'peek':case'blur':return $('photo');
    case'hl':{var i=nextKeySeg();return i>=0?q1('[data-act="hl"][data-i="'+i+'"]'):null;}
    case'hlcheck':return q1('[data-act="hlcheck"]');
    case'swcard':{for(var j=0;j<S.sw.cards.length;j++)if(S.sw.cards[j].id===s.id)return q1('[data-act="swcard"][data-i="'+j+'"]');return null;}
    case'swcat':return q1('[data-act="swcat"][data-c="'+s.c+'"]');
    case'swall':{var h=GP.swapHint3(S.sw);if(!h)return null;return h.k==='swcard'?q1('[data-act="swcard"][data-i="'+h.i+'"]'):q1('[data-act="swcat"][data-c="'+h.c+'"]');}
  }return null;}
function tutRender(){
  var st=T.st;if(!st||S.screen!=='play')return;
  var tl=$('tlist');if(tl)tl.innerHTML=tutListInner();
  if(S.phase==='pass'){
    /* 結果框有進場動畫（等整人畫面演完），框出來之後對話框才指過去 */
    if(!st.passShown){coachOff();var pb=q1('#cR .pbox'),dl=pb?parseFloat(pb.style.animationDelay)||0:0;tutLater(function(){T.st.passShown=true;tutRender();},dl*1000+450);return;}
    coachShow({mode:'ok',html:'太棒了！這一課完成了。',target:q1('#cR .pbox .btn.gold'),anchor:q1('#cR .pbox')});return;}
  var s=st.steps[st.i];if(!s){coachOff();return;}
  var tg=tutTarget(s),txt=st.mode==='say'?(st.stuck&&s.more?s.more:s.say):st.msg;
  var clicky=/^(pick|unpick|rub|peek|hl|hlcheck|swcard|swcat|swall)$/.test(s.k);
  var head='<div class="chd">第 '+(st.i+1)+' / '+st.steps.length+' 步'+(clicky&&st.mode==='say'?'<span>'+MOUSE+'用滑鼠左鍵點</span>':'')+'</div>';
  var btns=s.k==='ack'&&st.mode!=='ok'?'<button class="btn gold" data-act="tutok">我知道了</button>':'';
  var hideT=s.k==='ack'||s.k==='blur';
  coachShow({mode:st.mode,html:esc(txt),head:head,btns:btns,target:hideT?null:tg,anchor:s.k==='ack'?$('lbs'):s.k==='blur'?$('photo'):(tg||q1('#cR .cats')||q1('#cR .tray')),ghost:st.mode==='say'&&st.stuck&&!hideT,keep:/^hl/.test(s.k)?[['#cR .letter',6],['#cBig',.3]]:null});
}
/* 檢查學生這一下做得對不對：'ok' 完成這一步／'go' 可以做但這步還沒完成／{bad:'…'} 擋下來並說明／'free' 不管它 */
function pickWhy(id,want){
  var c=CARD[id],w=CARD[want],src=S.lv.type==='letter'?'信裡':'照片裡',sol=GP.solve(S.v,S.lv);
  if(c.ty==='noise')return'「'+c.t+'」跟畫畫沒關係，放了也沒用。這一步要放「'+w.t+'」。';
  if(c.ap===w.ap&&c.ty!=='good')return'「'+c.t+'」說得不清楚，神燈會亂畫！要放說得清楚的「'+w.t+'」。';
  if(c.ap===w.ap)return'仔細看'+src+'：是「'+w.t+'」，不是「'+c.t+'」。';
  if(sol.indexOf(id)>=0)return'「'+c.t+'」等一下才放。順序很重要，先放「'+w.t+'」。';
  return'「'+c.t+'」不是這一步要的，點「'+w.t+'」。';
}
function tutCheck(s,act,t){
  if(/^(mute|pause|resume|map|home|restart|next|tutfin|tutgo|tutgo2|hintopen|hintclose|hint)$/.test(act))return'free';
  if(act==='peek')return s.k==='peek'?'ok':'free';
  if(act==='tutok')return s.k==='ack'?'ok':'free';
  var stepN=stepName(s);
  if(s.k==='ack')return{bad:'先看看神燈怎麼整你，看完按「我知道了」。'};
  if(s.k==='blur')return{bad:'先把照片看仔細，等一下照片會縮小。'};
  if(s.k==='peek')return{bad:'照片縮小了，先點一下照片，再看一次。'};
  switch(act){
    case'pick':{var id=poolId(t.getAttribute('data-u'));
      if(s.k==='pick')return id===s.id?'ok':{bad:pickWhy(id,s.id)};
      if(s.k==='unpick')return{bad:'先把格子裡的「'+CARD[s.id].t+'」拿回來，再放新的卡。'};
      return{bad:'這一步要'+stepN+'。'};}
    case'unpick':{var uid=poolId(S.slots[parseInt(t.getAttribute('data-s'),10)]);
      if(s.k==='unpick')return uid===s.id?'ok':{bad:'「'+CARD[uid].t+'」是對的，留著！要拿回來的是「'+CARD[s.id].t+'」。'};
      return{bad:'格子裡的「'+CARD[uid].t+'」是對的，不用拿回來。這一步要'+stepN+'。'};}
    case'clear':return{bad:'先不要全部清空喔！這一步要'+stepN+'。'};
    case'rub':return s.k==='rub'?'ok':{bad:'願望還沒寫好，先'+stepN+'。'};
    case'hl':{var i=parseInt(t.getAttribute('data-i'),10),sg=letterSegs(S.v.text)[i];
      if(s.k!=='hl')return{bad:'這一步要'+stepN+'。'};
      if(!sg.k)return{bad:'「'+sg.t.replace(/[，。！？]$/,'')+'」跟畫畫沒關係，不用畫起來。'};
      if(S.hl.sel[i])return{bad:'「'+sg.t+'」是重點，留著！'};
      return'go';}
    case'hlcheck':if(s.k==='hlcheck')return'ok';if(s.k==='hl')return{bad:'還有重點沒畫起來，再找找：幾隻、什麼顏色、是誰。'};return{bad:'這一步要'+stepN+'。'};
    case'swcard':{var c=S.sw.cards[parseInt(t.getAttribute('data-i'),10)];
      if(s.k==='swcard')return c.id===s.id?'ok':{bad:'「'+c.t+'」寫得很清楚，'+(c.ap==='kind'?'照片裡就是'+c.t:'沒有問題')+'。找說不清楚的那個詞。'};
      if(s.k==='swall'){var k=GP.cardKeyOf(S.sw.P,c);return S.sw.w.all.some(function(f){return f.key===k&&S.sw.found.indexOf(f.key)<0;})?'go':{bad:'「'+c.t+'」寫得很清楚，不是漏洞。看看照片裡還有什麼願望沒寫到。'};}
      return{bad:'這一步要'+stepN+'。'};}
    case'swcat':{var cat=t.getAttribute('data-c'),nm=GP.SW_CAT_NAME[cat];
      if(s.k==='swcat')return cat===s.c?'ok':{bad:'「'+nm+'」不是這一步要找的。'+s.say.split('！')[0]+'！'};
      if(s.k==='swall')return GP.swapHit(S.sw.w.all,cat,S.sw.found).length?'go':{bad:'「'+nm+'」願望寫清楚了（或照片裡沒有），不是漏洞。再看看照片。'};
      return{bad:'先'+stepN+'。'};}
  }
  return{bad:'這一步要'+stepN+'。'};
}
function tutGate(act,t){
  var st=T.st;if(!st||S.screen!=='play'||S.phase!=='play')return'free';
  if(st.mode==='ok'&&!/^(mute|pause|resume|map|home|restart)$/.test(act))return'block';
  var s=st.steps[st.i];if(!s)return'free';
  var r=tutCheck(s,act,t);
  if(r&&r.bad){tutBad(r.bad,t);return'block';}
  if(r==='ok'||r==='go')st.okRect=stRect(t);
  return r;
}
function tutBad(msg,t){var st=T.st;st.mode='bad';st.msg=msg;sfx('err',.45);tutRender();
  if(t&&t.classList){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');}
  var i=st.i,m=msg;tutLater(function(){if(T.st.i===i&&T.st.mode==='bad'&&T.st.msg===m){T.st.mode='say';tutRender();}},3200);}
function tutDoneNow(s){if(s.k==='hl')return nextKeySeg()<0;if(s.k==='swall')return S.phase==='pass';return false;}
function tutPost(r){var st=T.st;if(!st)return;var s=st.steps[st.i];if(!s)return;
  if(r==='ok'||(r==='go'&&tutDoneNow(s)))tutOk(s);else if(r==='go')tutRender();}
function tutOk(s){
  var st=T.st;st.mode='ok';var failRub=s.k==='rub'&&S.prank&&!S.prank.pass;
  st.msg=pickOf(PRAISE)+(failRub?' 看神燈怎麼畫……':'');
  if(!failRub)okMark(st.okRect);sfx('win',.3);
  if(S.phase==='pass'){st.i=st.steps.length;tutRender();return;}
  tutRender();
  tutLater(function(){T.st.i++;T.st.stuck=false;if(T.st.i>=T.st.steps.length){tutComplete();return;}tutArm();tutRender();},failRub?3200:1000);
}
function tutEvent(ev){var st=T.st;if(!st||S.phase!=='play')return;var s=st.steps[st.i];if(s&&s.k===ev){var ph=$('photo');st.okRect=ph?stRect(ph):null;tutOk(s);}}
function tutComplete(){S.phase='pass';S.earn=award({coins:0});saveRec(S.earn);S.fresh=false;renderPlay();}
/* 全部教學課完成：彩帶＋神燈＋徽章 → 說明正式關卡 → 繼續進第 2 章第 1 關 */
function tutCelebrate(){
  sfx('win',.6);var cf='',cols=['#F6CD63','#C93A4E','#1F8F9A','#8A5BB8','#F5EFFB','#4FB86A'];
  for(var i=0;i<60;i++)cf+='<i style="left:'+((i*37)%100)+'%;background:'+cols[i%cols.length]+';animation-delay:'+((i*0.07)%1.8).toFixed(2)+'s;animation-duration:'+(2.2+(i%5)*.35).toFixed(2)+'s;transform:rotate('+(i*29%360)+'deg)"></i>';
  overlay('<div class="confetti">'+cf+'</div><div class="modal cel"><div class="clamp">'+bigLamp('celg')+'</div><div class="badge"><b>許願學徒</b><span>新手教學 全部完成</span></div><h2>恭喜你！新手教學全部完成！</h2><p>你學會了：放卡片、許願、改願望、每一樣都寫清楚、'+(S.g==='g5'?'大小和動作、':'')+'看縮小的照片、畫信的重點、當神燈找漏洞。</p><p><button class="btn gold big" data-act="tutgo">繼續 ›</button></p></div>');
}
function tutRules(){
  overlay('<div class="modal rules"><h2>開始挑戰正式關卡</h2><ul>'+
   '<li>每位客人最多許願 <b>3 次</b>，越早成功金幣越多。客人有耐心條，太久會走掉。</li>'+
   '<li>不會的時候，按願望旁邊的 <b>'+LAMP+'提示</b>：<br><span class="hc">提示一 免費</span><span class="hc">提示二 這關最多 2 枚</span><span class="hc">提示三 這關最多 1 枚</span></li>'+
   '<li>想拿滿金幣？按「換一位」或「再玩一次」換新客人，提示會重新算。</li></ul>'+
   '<p><button class="btn gold big" data-act="tutgo2">繼續 ›</button></p></div>');
}

/* ---------- 提示一二三（正式關卡） ---------- */
var HN=['提示一','提示二','提示三'],HC=['免費','這關最多 2 枚','這關最多 1 枚'];
function hintBtn(){if(S.cert||!S.lv||S.lv.tut||S.phase!=='play')return'';return'<button class="btn hbtn" data-act="hintopen" id="hbtn">'+LAMP+'提示'+(S.hint?'<small>'+S.hint+'</small>':'')+'</button>';}
function slotIds(){return S.slots.map(function(u){return u?poolId(u):null;});}
function trayIds(){var used={};S.slots.forEach(function(u){if(u)used[u]=1;});return S.pool.filter(function(p){return!used[p.u];}).map(function(p){return p.id;});}
/* 算出提示 i 的文字和提示三要示範的東西 */
function hintFor(i){
  var lv=S.lv,v=S.v,ty=lv.type||'play';
  if(i===0)return{t:GP.hint1(lv)};
  if(ty==='swap'){if(i===1)return{t:GP.swapHint2(S.sw)};var h=GP.swapHint3(S.sw);return h?{t:h.t,el:h.k==='swcard'?q1('[data-act="swcard"][data-i="'+h.i+'"]'):q1('[data-act="swcat"][data-c="'+h.c+'"]')}:{t:'漏洞全部找到了！'};}
  if(ty==='bad'){if(i===1)return{t:GP.badHint2(v)};var b=GP.badHint3(v);return{t:b.t,el:q1('[data-act="bad"][data-i="'+b.i+'"]')};}
  if(ty==='letter'&&!S.hl.checked&&i===2){var segs=letterSegs(v.text),wr=-1,j;for(j=0;j<segs.length;j++)if(!segs[j].k&&S.hl.sel[j]){wr=j;break;}
    if(wr>=0)return{t:'「'+segs[wr].t+'」不是重點，點它取消。',el:q1('[data-act="hl"][data-i="'+wr+'"]')};
    var nk=nextKeySeg();if(nk>=0)return{t:'先把信的重點畫起來：點「'+segs[nk].t+'」。',el:q1('[data-act="hl"][data-i="'+nk+'"]')};
    return{t:'重點都畫好了，按「畫好重點了」。',el:q1('[data-act="hlcheck"]')};}
  if(i===1)return{t:GP.hint2(lv,v,curCards())};
  var h3=GP.hint3(lv,v,slotIds(),trayIds()),el=null;
  if(h3.k==='pick'){var u=poolU(h3.id);el=u?q1('#cR .tray [data-u="'+u+'"]'):null;}
  else if(h3.k==='unpick')el=q1('[data-act="unpick"][data-s="'+h3.i+'"]');
  else el=q1('#cR .btn.rub');
  return{t:h3.t,el:el};
}
function hintRender(){
  if(!S.hintOpen)return;var cur=S.hintTxt,b='';
  for(var i=0;i<3;i++)b+='<button class="hb'+(i<S.hint?' used':'')+(cur&&cur.i===i?' on':'')+'" data-act="hint" data-i="'+i+'"'+(i>S.hint?' disabled':'')+'><b>'+HN[i]+'</b><small>'+(i<S.hint?'再看一次':HC[i])+'</small></button>';
  var capT=S.hint>=2?'用了'+HN[S.hint-1]+'：這關最多 '+GP.hintCap(S.hint)+' 枚':'還沒扣金幣，可以拿滿';
  var html=cur?'<span class="pill">'+HN[cur.i]+'</span>'+esc(cur.t):'卡住了嗎？提示要一個一個開。';
  var el=cur&&cur.i===2?hintFor(2).el:null;
  coachShow({mode:'hint',html:html,head:'<div class="chd hcap">'+capT+(S.patMax>0||S.lv.type==='flash'?'<span>（看提示時，時間暫停）</span>':'')+'</div>',btns:'<div class="hbs">'+b+'</div><button class="btn gray sm" data-act="hintclose">關閉</button>',target:el,anchor:el||$('hbtn')||q1('#cR'),ghost:!!el});
}
function openHint(i){
  if(i>S.hint)return;if(i===S.hint)S.hint++;
  S.hintTxt={i:i,t:hintFor(i).t};sfx('click',.4);hintRender();
  var hb=$('hbtn');if(hb)hb.innerHTML=LAMP+'提示<small>'+S.hint+'</small>';
}
function hintOpen(){if(S.hintOpen){hintClose();return;}S.hintOpen=true;S.hintPaused=!S.paused;S.paused=true;S.hintTxt=null;hintRender();}
function hintClose(){if(!S.hintOpen)return;S.hintOpen=false;S.hintTxt=null;if(S.hintPaused)S.paused=false;coachOff();}

/* ---------- 第一次遇到新玩法：神燈先在旁邊說怎麼玩（不另開教學課） ---------- */
function introFor(lv){var t=lv.type||'play';
  if(t==='flash')return{k:'flash',t:'這關是「閃電看圖」：照片只給你看 '+(lv.sec||8)+' 秒，然後就蓋起來！按「開始」後趕快記住：是誰、幾隻、什麼顏色、在哪裡。',sel:'#photo',b:'開始'};
  if(t==='mosaic')return{k:'mosaic',t:'這關是「馬賽克」：照片糊糊的。按「看清楚一點」會變清楚，但按越多次金幣越少。看得懂了就不用再按。',sel:'[data-act="mosmore"]',b:'知道了'};
  if(t==='bad')return{k:'bad',t:'這關是「找出壞詞」：左邊是神燈整人的畫。下面這句願望裡，有一個詞害神燈鑽漏洞，點出那個詞！',sel:'#cR .chips',b:'知道了'};
  if(t==='short')return{k:'short',t:'這關格子只有 '+lv.slots+' 格！只寫客人在乎的，其他都不要寫。',sel:'#cR .slots',b:'知道了'};
  return null;}
function introRender(){var it=introFor(S.lv);if(!it)return;var el=q1(it.sel);
  coachShow({mode:'say',html:esc(it.t),head:'<div class="chd">新玩法</div>',btns:'<button class="btn gold" data-act="introok">'+it.b+'</button>',target:el,anchor:el,ghost:it.k==='mosaic'});}
function introOk(){var it=introFor(S.lv);S.intro=false;S.paused=false;if(it){SV[S.g].seen=SV[S.g].seen||{};SV[S.g].seen[it.k]=1;writeSave();}coachOff();}

function afterRender(){
  if(S.screen!=='play')return;
  if(T.st)tutRender();
  else if(S.intro)introRender();
  else if(S.hintOpen)hintRender();
  else coachOff();
}

/* ---------- 老師跳過教學（密碼 naes5922023） ---------- */
function tskipAsk(msg){overlay('<div class="modal"><h2>老師跳過教學</h2><p>輸入老師密碼，這個年級的新手教學直接算完成。</p><p><input id="tpw" type="password" maxlength="20" style="font-size:30px;width:300px;text-align:center;border:3px solid var(--violet);border-radius:12px;padding:6px;font-family:inherit"></p><div class="msg">'+(msg||'')+'</div><p><button class="btn gold" data-act="tskipok">確定</button>　<button class="btn gray" data-act="tskipno">取消</button></p></div>');var e=$('tpw');if(e)e.focus();}
function tskipOk(){var e=$('tpw');if(!e||e.value!=='naes5922023'){sfx('err',.5);tskipAsk('密碼不對');return;}
  tutLessons(S.g).forEach(function(l){if(!SV[S.g].lv[l.id])SV[S.g].lv[l.id]={coins:0,skip:true};});writeSave();sfx('win',.5);overlay();goMap();}

/* ---------- 事件 ---------- */
function onAct(act,t){
  var lv=S.lv,i,tg='free';
  if(T.st&&S.screen==='play'){tg=tutGate(act,t);if(tg==='block')return;}
  if(S.hintOpen&&/^(pick|unpick|clear|rub|swcard|swcat|bad|hl|hlcheck|mosmore|peek|map|restart|pause)$/.test(act))hintClose();
  if(/^(pick|unpick|clear|key|play|map|gal|gpg|door|kclose|hl|hlcheck|mosmore|peek|pause|resume|next|restart|retry|cert|certstart|certnext|home|swcard|swcat)$/.test(act)&&act!=='swcard'&&act!=='swcat')sfx(act==='door'?'open':act==='pick'?'pick':act==='unpick'||act==='clear'?'back':'click',.5);
  switch(act){
    case'mute':toggleMute();break;
    case'door':S.doorTry=t.getAttribute('data-g');S.code='';renderKeypad('');break;
    case'kclose':S.doorTry=null;S.code='';overlay();break;
    case'key':pressKey(t.getAttribute('data-k'));break;
    case'home':S.g=null;stopTimer();overlay();show('door');renderDoor();break;
    case'map':stopTimer();goMap();break;
    case'gal':S.gpage=0;goGal();break;
    case'buy':{var gid=t.getAttribute('data-gid'),G=SV[S.g];
      if(!G.gal[gid]&&wallet(S.g)>=GAL_PRICE){G.spent=spent(S.g)+GAL_PRICE;G.gal[gid]=2;writeSave();sfx('win',.5);S.bought=gid;}else sfx('err',.5);
      goGal();break;}
    case'gpg':S.gpage=Math.max(0,S.gpage+parseInt(t.getAttribute('data-d'),10));goGal();break;
    case'play':{var l=findLv(S.g,t.getAttribute('data-id'));if(l&&unlocked(S.g,l))startLevel(l);break;}
    case'cert':if(mainDone(S.g))goCert();break;
    case'certstart':certStart();break;
    case'certnext':certNext();break;
    case'nickrand':{var el=$('nick');if(el)el.value=NICKS[Math.floor(Math.random()*NICKS.length)];break;}
    case'nickok':nickOk(parseInt(t.getAttribute('data-ok'),10));break;
    case'pick':{var u=t.getAttribute('data-u');if(S.phase!=='play')break;var s=S.slots.indexOf(null);if(s<0){S.note='格子滿了！點格子裡的卡可以拿回來。';}else S.slots[s]=u;renderPlay();break;}
    case'unpick':if(S.phase==='play'){S.slots[parseInt(t.getAttribute('data-s'),10)]=null;renderPlay();}break;
    case'clear':if(S.phase==='play'){for(i=0;i<S.slots.length;i++)S.slots[i]=null;renderPlay();}break;
    case'rub':doRub();break;
    case'peek':if(S.phase==='play'&&isBlur()){S.peek=3;if(S.patMax>0){S.pat=Math.max(1,S.pat-8);updPat();}applyBlur();}break;
    case'swcard':{if(S.phase!=='play')break;var ci=parseInt(t.getAttribute('data-i'),10),c=S.sw.cards[ci],k=cardKey(S.sw.P,c),
      fl=k===null?[]:S.sw.w.all.filter(function(f){return f.key===k&&S.sw.found.indexOf(f.key)<0;});
      if(fl.length)swapFindFlaws(fl);else{S.sw.tried['w'+ci]=1;swapWrong(c.ty==='noise'?'「'+c.t+'」？我加蝴蝶結就好，這不算漏洞喔～':pickOf(NOTE_OK));}break;}
    case'swcat':{var cat=t.getAttribute('data-c');if(S.phase!=='play')break;var hit=GP.swapHit(S.sw.w.all,cat,S.sw.found);
      if(hit.length)swapFindFlaws(hit);else{S.sw.tried['c'+cat]=1;swapWrong(pickOf(NOTE_OK));}break;}
    case'mosmore':if(S.phase==='play'&&S.lv.type==='mosaic'&&S.mosC<GP.MOSAIC.cols.length-1){S.mosC++;renderPlay();}break;
    case'hl':if(!S.hl.checked){i=t.getAttribute('data-i');S.hl.sel[i]=!S.hl.sel[i];renderPlay();}break;
    case'hlcheck':{
      if(!Object.keys(S.hl.sel).some(function(k){return S.hl.sel[k];})){S.note='先點一點信裡重要的詞喔！';renderPlay();break;}
      var ok=true;letterSegs(S.v.text).forEach(function(sg,j){if(!!sg.k!==!!S.hl.sel[j])ok=false;});
      S.hl.checked=true;S.hl.ok=ok;S.say=ok?'重點全部抓對了！得到一顆重點星。再用卡片寫願望吧。':'金色的字是真正的重點（紅框是你漏掉的，劃線是不必要的）。再用卡片寫願望吧。';renderPlay();break;}
    case'bad':doBad(parseInt(t.getAttribute('data-i'),10));break;
    case'next':{var nx=nextLevel();if(nx)startLevel(nx);else goMap();break;}
    case'restart':startLevel(lv);break;
    case'retry':startLevel(lv,{vi:S.vi,late:true});break;
    case'pause':S.paused=true;overlay('<div class="modal"><h2>休息一下</h2><p>畫面先蓋起來囉。</p><p><button class="btn gold" data-act="resume">繼續</button>　<button class="btn gray" data-act="map">回地圖</button></p></div>',true);break;
    case'resume':S.paused=false;overlay();renderPlay();break;
    case'tutok':break;
    case'tutfin':tutCelebrate();break;
    case'tutgo':sfx('click',.5);tutRules();break;
    case'tutgo2':{sfx('click',.5);overlay();var f2=mainLevels(S.g)[tutLessons(S.g).length];if(f2)startLevel(f2);else goMap();break;}
    case'hintopen':hintOpen();break;
    case'hintclose':hintClose();break;
    case'hint':openHint(parseInt(t.getAttribute('data-i'),10));break;
    case'introok':sfx('click',.5);introOk();break;
    case'tskip':tskipAsk('');break;
    case'tskipok':tskipOk();break;
    case'tskipno':overlay();break;
  }
  if(tg==='ok'||tg==='go')tutPost(tg);
}
document.addEventListener('click',function(e){var t=e.target;while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-act')))t=t.parentNode;if(t&&t!==document)onAct(t.getAttribute('data-act'),t);});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='tpw'){tskipOk();e.preventDefault();return;}
  if(!S.doorTry)return;
  if(/^[0-9]$/.test(e.key)){pressKey(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){pressKey('bs');e.preventDefault();}
  else if(e.key==='Enter'){pressKey('ok');e.preventDefault();}
  else if(e.key==='Escape'){S.doorTry=null;S.code='';overlay();}
});

/* ---------- 自動檢查畫面 ---------- */
function runSelftest(){
  show('door');$('scr-door').innerHTML='<h1 style="font-size:44px;top:10px">神燈畫家 自動檢查中…</h1>';
  var t0=Date.now(),r;
  try{r=GP.selftest();}catch(err){r={pass:false,items:[{id:0,name:'檢查程式出錯',pass:false,detail:String(err&&err.stack||err)}]};}
  window.__selftest=r;
  var h='<h2>神燈畫家 selftest：'+(r.pass?'全部通過':'有項目失敗')+'（'+(Date.now()-t0)+' ms）</h2>';
  r.items.forEach(function(it){h+='<div style="color:'+(it.pass?'#1a6a1a':'#b00')+'">'+(it.pass?'✔':'✘')+' '+it.id+'. '+esc(it.name)+'<br>　　'+esc(it.detail)+'</div>';});
  var sf=$('sf');sf.innerHTML=h;sf.style.display='block';
}
window.__gpUI={fn:{goGal:goGal,mainLevels:mainLevels,renderKeypad:renderKeypad,overlay:overlay,goMap:goMap},S:S,start:function(g,id,vi){S.g=g;overlay();startLevel(findLv(g,id),{vi:vi});},map:function(g){S.g=g;goMap();},cert:function(g){S.g=g;goCert();},setSave:function(o){SV=o;writeSave();}};
/* ---------- 啟動 ---------- */
if(/[?&]selftest=1/.test(location.search)){runSelftest();}
else{renderDoor();show('door');}
})();
/*UI-END*/
